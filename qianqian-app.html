/* ============ 浅浅的工作台 · 莫兰迪主题 ============ */
:root{
  /* 背景层 */
  --bg:#F3F0EB;
  --bg-2:#EDE8E1;
  --card:#FCFAF7;
  --card-2:#F7F4EF;
  --line:#E4DDD3;
  --line-2:#EFEAE3;

  /* 文字 */
  --ink:#4C4842;
  --ink-2:#807A72;
  --ink-3:#A9A29A;
  --ink-4:#C4BDB4;

  /* 莫兰迪主色盘 */
  --sage:#9FB3A4;      --sage-s:#E7EEE8;
  --clay:#C9A492;      --clay-s:#F4E8E2;
  --mist:#A3B4C2;      --mist-s:#E6EDF2;
  --lilac:#AFA3B8;     --lilac-s:#EEEAF1;
  --sand:#CBB999;      --sand-s:#F3EDE1;
  --rose:#C79AA0;      --rose-s:#F4E7E9;
  --olive:#AFB292;     --olive-s:#EFF0E4;
  --terra:#BE9184;     --terra-s:#F2E6E1;

  --ok:#8FA98E;
  --warn:#C9A06A;
  --up:#C0736F;   /* 涨/支出 红 */
  --down:#7F9E86; /* 跌/收入 绿 */

  --r-l:22px; --r-m:16px; --r-s:11px;
  --sh:0 1px 2px rgba(76,72,66,.04), 0 6px 18px -8px rgba(76,72,66,.14);
  --sh-2:0 2px 4px rgba(76,72,66,.05), 0 14px 34px -14px rgba(76,72,66,.22);
  --ff:"PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",-apple-system,system-ui,sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--ff); color:var(--ink); background:#E8E3DC;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;font-size:inherit;}
input,textarea,select{font-family:inherit;color:var(--ink);font-size:15px;}
::-webkit-scrollbar{width:0;height:0;}

/* ============ 手机外壳 ============ */
.phone{
  position:relative;width:100%;max-width:430px;height:100vh;max-height:940px;
  background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 30px 80px -30px rgba(60,55,50,.4);
}
@media(min-width:520px){
  body{background:var(--bg);}
  .phone{width:100%;max-width:none;height:100vh;max-height:none;border-radius:0;box-shadow:none;}
  .screen{max-width:900px;margin:0 auto;width:100%;}
}

/* ============ 顶部栏 ============ */
.topbar{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(14px + env(safe-area-inset-top)) 18px 12px;
  background:linear-gradient(180deg,#F7F4EF 0%,rgba(243,240,235,.92) 100%);
  border-bottom:1px solid var(--line-2);backdrop-filter:blur(12px);z-index:20;
}
.topbar-l{display:flex;align-items:center;gap:11px;min-width:0;}
.avatar{
  width:40px;height:40px;border-radius:14px;flex:0 0 auto;
  background:linear-gradient(140deg,var(--clay),var(--sand));
  color:#fff;display:grid;place-items:center;font-size:17px;font-weight:600;
  box-shadow:0 4px 12px -4px rgba(201,164,146,.7);
}
.topbar-txt{min-width:0;}
.topbar-txt h1{margin:0;font-size:16.5px;font-weight:650;letter-spacing:.4px;}
.topbar-txt p{margin:2px 0 0;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-r{display:flex;align-items:center;gap:8px;}
.icon-btn{
  height:32px;min-width:32px;padding:0 10px;border-radius:11px;background:var(--card);
  border:1px solid var(--line);display:flex;align-items:center;gap:5px;
  font-size:12.5px;font-weight:600;color:var(--ink-2);
}
.icon-btn:active{transform:scale(.94);}
.coin-dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(140deg,var(--sand),var(--clay));}

/* ============ 内容区 ============ */
.screen{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:16px 16px 24px;
  -webkit-overflow-scrolling:touch;
}
.screen>*{animation:rise .38s cubic-bezier(.22,.9,.3,1) both;}
@keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

/* ============ 底部导航 ============ */
.tabbar{
  flex:0 0 auto;display:grid;grid-template-columns:repeat(6,1fr);
  padding:7px 6px calc(7px + env(safe-area-inset-bottom));
  background:rgba(252,250,247,.94);backdrop-filter:blur(16px);
  border-top:1px solid var(--line-2);z-index:20;
}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:12px;color:var(--ink-4);transition:color .2s;}
.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.tab span{font-size:10.5px;font-weight:600;letter-spacing:.3px;}
.tab.active{color:var(--terra);}
.tab.active svg{transform:translateY(-1px);}
.tab:active{transform:scale(.93);}

/* ============ 通用卡片 ============ */
.card{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-l);padding:16px;box-shadow:var(--sh);margin-bottom:14px;}
.card.tight{padding:13px 14px;}
.card.flat{box-shadow:none;background:var(--card-2);}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
.sec-head h2{margin:0;font-size:15px;font-weight:650;letter-spacing:.3px;display:flex;align-items:center;gap:7px;}
.sec-head .more{font-size:11.5px;color:var(--ink-3);font-weight:500;}
.dot{width:7px;height:7px;border-radius:2.5px;flex:0 0 auto;}
.muted{color:var(--ink-3);font-size:12px;}
.tiny{font-size:11px;color:var(--ink-3);}

/* 页头 */
.page-hero{margin-bottom:16px;}
.page-hero .date{font-size:11.5px;color:var(--ink-3);letter-spacing:1.4px;text-transform:uppercase;font-weight:600;}
.page-hero h2{margin:6px 0 4px;font-size:24px;font-weight:680;letter-spacing:.5px;line-height:1.25;}
.page-hero p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.6;}

/* 药丸 / 标签 */
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:8px;font-size:10.5px;font-weight:600;letter-spacing:.2px;}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;}
.chip{flex:0 0 auto;padding:6px 13px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2);transition:.18s;}
.chip.on{background:var(--ink);color:#F7F4EF;border-color:var(--ink);}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:13px;font-size:13.5px;font-weight:650;background:var(--ink);color:#F7F4EF;transition:.16s;}
.btn:active{transform:scale(.97);}
.btn.ghost{background:var(--card);color:var(--ink-2);border:1px solid var(--line);}
.btn.soft{background:var(--sage-s);color:#5F7563;}
.btn.block{width:100%;}
.btn.sm{padding:8px 13px;font-size:12.5px;border-radius:11px;}
.btn[disabled]{opacity:.45;pointer-events:none;}

/* 输入 */
.fld{margin-bottom:12px;}
.fld label{display:block;font-size:11.5px;font-weight:650;color:var(--ink-2);margin-bottom:6px;letter-spacing:.3px;}
.inp,textarea.inp,select.inp{
  width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);
  background:var(--card-2);outline:none;transition:.18s;font-size:14px;
}
.inp:focus{border-color:var(--clay);background:#fff;box-shadow:0 0 0 3px rgba(201,164,146,.14);}
textarea.inp{resize:vertical;min-height:76px;line-height:1.65;}

/* 进度条 */
.bar{height:7px;border-radius:4px;background:var(--line-2);overflow:hidden;}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--sage);transition:width .5s cubic-bezier(.3,1,.4,1);}

/* 空态 */
.empty{text-align:center;padding:26px 14px;color:var(--ink-3);font-size:12.5px;line-height:1.8;}
.empty .em{font-size:26px;display:block;margin-bottom:6px;opacity:.6;}

/* 网格 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}

/* ============ 今日页 ============ */
.hero-card{
  border-radius:24px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#DCE4DC 0%,#EDE6DE 55%,#E8DDD6 100%);
  border:1px solid rgba(255,255,255,.6);box-shadow:var(--sh-2);
}
.hero-card::after{content:"";position:absolute;right:-38px;top:-46px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.34);}
.hero-card::before{content:"";position:absolute;right:24px;bottom:-56px;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.2);}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;gap:12px;}
.hero-date{font-size:11px;letter-spacing:2px;color:#7B7268;font-weight:700;}
.hero-h{margin:7px 0 0;font-size:21px;font-weight:680;color:#4A453F;line-height:1.3;}
.hero-quote{margin:9px 0 0;font-size:12px;color:#6E6660;line-height:1.7;max-width:78%;position:relative;z-index:1;}
.ring{position:relative;width:66px;height:66px;flex:0 0 auto;}
.ring svg{transform:rotate(-90deg);}
.ring-txt{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:700;color:#59524B;}
.hero-stats{display:flex;gap:16px;margin-top:14px;position:relative;z-index:1;}
.hero-stats div{font-size:11px;color:#7B7268;}
.hero-stats b{display:block;font-size:16px;color:#4A453F;font-weight:680;margin-bottom:1px;}

/* 待办 */
.todo{display:flex;align-items:flex-start;gap:11px;padding:11px 2px;border-bottom:1px dashed var(--line-2);}
.todo:last-child{border-bottom:none;}
.tbox{width:20px;height:20px;border-radius:7px;border:1.8px solid var(--ink-4);flex:0 0 auto;margin-top:1px;display:grid;place-items:center;transition:.18s;}
.tbox.on{background:var(--sage);border-color:var(--sage);}
.tbox.on::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px);}
.todo-body{flex:1;min-width:0;}
.todo-t{font-size:14px;line-height:1.45;word-break:break-word;}
.todo.done .todo-t{color:var(--ink-4);text-decoration:line-through;}
.todo-m{display:flex;gap:6px;align-items:center;margin-top:4px;}
.todo-x{color:var(--ink-4);font-size:15px;padding:2px 4px;flex:0 0 auto;}
.add-row{display:flex;gap:8px;margin-top:12px;}
.add-row .inp{flex:1;}

/* 复盘 */
.rv-q{margin-bottom:12px;}
.rv-q h4{margin:0 0 6px;font-size:12.5px;font-weight:650;color:var(--ink-2);display:flex;align-items:center;gap:6px;}
.mood-row{display:flex;gap:8px;margin-bottom:14px;}
.mood{flex:1;padding:9px 0;border-radius:13px;background:var(--card-2);border:1px solid var(--line-2);text-align:center;transition:.18s;}
.mood .e{font-size:19px;display:block;line-height:1.2;}
.mood .l{font-size:10px;color:var(--ink-3);margin-top:2px;}
.mood.on{background:var(--clay-s);border-color:var(--clay);}
.mood.on .l{color:var(--terra);font-weight:650;}
.stars{display:flex;gap:6px;}
.star{font-size:22px;color:var(--line);transition:.15s;}
.star.on{color:var(--sand);}

/* 新闻 */
.news-i{display:flex;gap:11px;padding:11px 0;border-bottom:1px dashed var(--line-2);}
.news-i:last-child{border-bottom:none;}
.news-n{width:20px;height:20px;border-radius:7px;background:var(--mist-s);color:var(--mist);font-size:11px;font-weight:700;display:grid;place-items:center;flex:0 0 auto;margin-top:2px;}
.news-b h5{margin:0;font-size:13.5px;font-weight:600;line-height:1.45;}
.news-b p{margin:4px 0 0;font-size:11.5px;color:var(--ink-3);line-height:1.6;}

/* ============ 理财页 ============ */
.money-hero{background:linear-gradient(135deg,#DFE5E9 0%,#E9E4E7 100%);}
.amt{font-size:27px;font-weight:680;letter-spacing:-.5px;}
.amt.out{color:var(--up);} .amt.in{color:var(--down);}
.kv{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line-2);font-size:13px;}
.kv:last-child{border-bottom:none;}
.kv b{font-weight:650;}
.day-row{cursor:pointer;border-radius:9px;padding-left:6px;padding-right:6px;margin:0 -6px;transition:.14s;}
.day-row:hover{background:var(--card-2);}
.day-add{color:var(--olive);font-weight:600;}
.menu-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line-2);font-size:14px;color:var(--ink);}
.menu-item:last-child{border-bottom:none;}
.menu-list{margin-bottom:10px;}
.cat-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
.cat-i{padding:9px 2px;border-radius:13px;background:var(--card-2);border:1px solid var(--line-2);text-align:center;transition:.16s;}
.cat-i .e{font-size:18px;display:block;}
.cat-i .l{font-size:10px;color:var(--ink-3);margin-top:3px;}
.cat-i.on{background:var(--sand-s);border-color:var(--sand);}
.cat-i.on .l{color:#8C7550;font-weight:650;}
.bill{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px dashed var(--line-2);}
.bill:last-child{border-bottom:none;}
.bill-e{width:34px;height:34px;border-radius:12px;background:var(--card-2);display:grid;place-items:center;font-size:16px;flex:0 0 auto;}
.bill-b{flex:1;min-width:0;}
.bill-b h5{margin:0;font-size:13.5px;font-weight:600;}
.bill-b p{margin:2px 0 0;font-size:10.5px;color:var(--ink-3);}
.bill-a{font-size:14.5px;font-weight:650;flex:0 0 auto;}
.barchart{display:flex;align-items:flex-end;gap:6px;height:86px;margin:6px 0 4px;}
.barchart .b{flex:1;background:var(--sage-s);border-radius:6px 6px 3px 3px;position:relative;min-height:4px;transition:height .5s;}
.barchart .b i{position:absolute;left:0;bottom:0;width:100%;border-radius:6px 6px 3px 3px;background:var(--sage);}
.bar-lbl{display:flex;gap:6px;}
.bar-lbl span{flex:1;text-align:center;font-size:9.5px;color:var(--ink-4);}
.lesson{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line-2);}
.lesson:last-child{border-bottom:none;}
.lesson-n{width:26px;height:26px;border-radius:9px;font-size:11px;font-weight:700;display:grid;place-items:center;flex:0 0 auto;background:var(--lilac-s);color:var(--lilac);}
.lesson.done .lesson-n{background:var(--sage);color:#fff;}
.lesson-b h5{margin:0;font-size:13.5px;font-weight:620;}
.lesson-b p{margin:3px 0 0;font-size:11.5px;color:var(--ink-3);line-height:1.6;}

/* ============ 学习页 ============ */
.book{display:flex;gap:12px;padding:13px 0;border-bottom:1px dashed var(--line-2);}
.book:last-child{border-bottom:none;}
.book-c{width:50px;height:68px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;text-align:center;padding:4px;line-height:1.3;box-shadow:0 4px 10px -4px rgba(0,0,0,.25);}
.book-b{flex:1;min-width:0;}
.book-b h5{margin:0;font-size:14px;font-weight:640;}
.book-b .au{font-size:11px;color:var(--ink-3);margin:3px 0 5px;}
.book-b .de{font-size:11.5px;color:var(--ink-2);line-height:1.6;}
.book-links{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap;}
.lk{padding:4px 9px;border-radius:8px;background:var(--card-2);border:1px solid var(--line);font-size:10.5px;color:var(--ink-2);text-decoration:none;font-weight:600;}
.lk:active{background:var(--line-2);}

.flash{
  border-radius:20px;padding:26px 18px;text-align:center;min-height:172px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(140deg,#E9EEE9,#F1EBE4);border:1px solid var(--line-2);cursor:pointer;
}
.flash .w{font-size:28px;font-weight:640;letter-spacing:.5px;}
.flash .ph{font-size:12.5px;color:var(--ink-3);}
.flash .mean{font-size:15px;font-weight:600;color:#5F7563;}
.flash .ex{font-size:12px;color:var(--ink-2);line-height:1.7;margin-top:4px;}
.flash .hint{font-size:10.5px;color:var(--ink-4);margin-top:6px;}
.dlg{padding:11px 0;border-bottom:1px dashed var(--line-2);}
.dlg:last-child{border-bottom:none;}
.dlg .who{font-size:10.5px;font-weight:700;color:var(--mist);letter-spacing:.5px;}
.dlg .en{font-size:13.5px;line-height:1.6;margin-top:3px;}
.dlg .cn{font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.6;}
.scene-tip{background:var(--mist-s);border-radius:13px;padding:11px 13px;font-size:11.5px;color:#5B6C78;line-height:1.7;margin-top:10px;}
.movie-hd{border-radius:16px;padding:14px;background:linear-gradient(135deg,#E4E0E8,#EFE9E4);margin-bottom:12px;}
.movie-hd h4{margin:0;font-size:15px;font-weight:650;}
.movie-hd p{margin:4px 0 0;font-size:11.5px;color:var(--ink-2);}
.blank{display:inline-block;min-width:52px;border-bottom:1.6px solid var(--clay);text-align:center;color:var(--terra);font-weight:650;}

/* ============ 生活页 ============ */
.recipe{border-radius:18px;overflow:hidden;border:1px solid var(--line-2);background:var(--card);margin-bottom:12px;box-shadow:var(--sh);}
.recipe-top{padding:14px 15px;background:linear-gradient(135deg,var(--sand-s),var(--clay-s));}
.recipe-top h4{margin:0;font-size:16px;font-weight:660;}
.recipe-meta{display:flex;gap:12px;margin-top:7px;}
.recipe-meta span{font-size:10.5px;color:#8A7A66;font-weight:600;}
.recipe-body{padding:13px 15px;}
.recipe-body h6{margin:0 0 5px;font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.6px;}
.recipe-body p{margin:0 0 11px;font-size:12.5px;line-height:1.75;color:var(--ink-2);}
.recipe-body ol{margin:0 0 11px;padding-left:17px;font-size:12.5px;line-height:1.85;color:var(--ink-2);}
.shot{position:relative;border-radius:16px;overflow:hidden;background:var(--card-2);border:1.6px dashed var(--line);aspect-ratio:1;display:grid;place-items:center;}
.shot img{width:100%;height:100%;object-fit:cover;}
.shot .ph{text-align:center;color:var(--ink-4);font-size:11px;}
.shot .ph .e{font-size:22px;display:block;margin-bottom:3px;}
.shot .del{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.42);color:#fff;font-size:12px;display:grid;place-items:center;}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}

/* 地球 Online */
.earth{border-radius:22px;padding:17px;background:linear-gradient(140deg,#D8E2DC 0%,#E4E7DE 50%,#EDE5DC 100%);border:1px solid rgba(255,255,255,.6);position:relative;overflow:hidden;margin-bottom:14px;}
.earth::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.3);}
.earth-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1;}
.earth-lv{font-size:11px;letter-spacing:1.6px;color:#6F7A6E;font-weight:700;}
.earth-t{margin:6px 0 0;font-size:19px;font-weight:680;color:#464C46;}
.earth-badge{width:52px;height:52px;border-radius:18px;background:rgba(255,255,255,.7);display:grid;place-items:center;font-size:24px;}
.exp-row{margin-top:14px;position:relative;z-index:1;}
.exp-row .lb{display:flex;justify-content:space-between;font-size:10.5px;color:#6F7A6E;font-weight:600;margin-bottom:5px;}
.quest{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px dashed var(--line-2);}
.quest:last-child{border-bottom:none;}
.q-e{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;font-size:17px;flex:0 0 auto;background:var(--olive-s);}
.q-b{flex:1;min-width:0;}
.q-b h5{margin:0;font-size:13.5px;font-weight:620;}
.q-b p{margin:3px 0 0;font-size:11px;color:var(--ink-3);}
.q-go{padding:6px 12px;border-radius:10px;background:var(--ink);color:#F7F4EF;font-size:11.5px;font-weight:650;flex:0 0 auto;}
.q-go.done{background:var(--sage-s);color:var(--sage);}
.quest.done h5{color:var(--ink-4);text-decoration:line-through;}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.badge{text-align:center;}
.badge .b{width:100%;aspect-ratio:1;border-radius:17px;background:var(--card-2);border:1px solid var(--line-2);display:grid;place-items:center;font-size:21px;filter:grayscale(1);opacity:.4;}
.badge.on .b{filter:none;opacity:1;background:var(--sand-s);border-color:var(--sand);}
.badge .n{font-size:9.5px;color:var(--ink-3);margin-top:5px;line-height:1.3;}

/* ============ 自媒体页 ============ */
.acct{border-radius:22px;padding:18px;background:linear-gradient(140deg,#E9DDE0 0%,#E5E2E9 60%,#DFE6E4 100%);border:1px solid rgba(255,255,255,.6);margin-bottom:14px;position:relative;overflow:hidden;}
.acct::after{content:"";position:absolute;right:-34px;bottom:-40px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.28);}
.acct .lb{font-size:10.5px;letter-spacing:1.8px;color:#7C7078;font-weight:700;}
.acct h3{margin:7px 0 0;font-size:23px;font-weight:700;color:#4A434A;letter-spacing:.5px;}
.acct .slogan{margin:7px 0 0;font-size:12px;color:#6D6570;line-height:1.7;position:relative;z-index:1;}
.acct-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px;position:relative;z-index:1;}
.acct-tags span{padding:4px 10px;border-radius:9px;background:rgba(255,255,255,.66);font-size:10.5px;font-weight:600;color:#6D6570;}
.hot{display:flex;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line-2);}
.hot:last-child{border-bottom:none;}
.hot-n{width:19px;height:19px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;flex:0 0 auto;margin-top:2px;}
.hot-b{flex:1;min-width:0;}
.hot-b h5{margin:0;font-size:13px;font-weight:600;line-height:1.5;}
.hot-b p{margin:3px 0 0;font-size:11px;color:var(--ink-3);line-height:1.6;}
.step{display:flex;gap:12px;}
.step-line{width:22px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;}
.step-dot{width:11px;height:11px;border-radius:50%;background:var(--line);border:2.5px solid var(--card);box-shadow:0 0 0 1.5px var(--line);margin-top:4px;}
.step.on .step-dot{background:var(--terra);box-shadow:0 0 0 1.5px var(--terra);}
.step-bar{flex:1;width:1.6px;background:var(--line-2);margin:4px 0;}
.step-b{flex:1;padding-bottom:16px;}
.step-b h5{margin:0;font-size:13.5px;font-weight:640;}
.step-b .wk{font-size:10px;color:var(--terra);font-weight:700;letter-spacing:.6px;}
.step-b p{margin:5px 0 0;font-size:11.5px;color:var(--ink-2);line-height:1.7;}
.tip-card{border-radius:18px;padding:16px;background:linear-gradient(135deg,#E6E2EA,#EFEAE3);border:1px solid var(--line-2);}
.tip-card .n{font-size:10.5px;letter-spacing:1.4px;color:var(--lilac);font-weight:700;}
.tip-card h4{margin:7px 0 6px;font-size:16px;font-weight:660;}
.tip-card p{margin:0;font-size:12.5px;line-height:1.8;color:var(--ink-2);}
.tip-steps{margin:10px 0 0;padding-left:16px;font-size:12px;line-height:1.85;color:var(--ink-2);}

/* ============ 弹层 ============ */
.sheet-mask{position:absolute;inset:0;background:rgba(60,55,50,.32);opacity:0;pointer-events:none;transition:.26s;z-index:40;backdrop-filter:blur(2px);}
.sheet-mask.on{opacity:1;pointer-events:auto;}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:41;max-height:82%;
  background:var(--bg);border-radius:26px 26px 0 0;transform:translateY(102%);
  transition:transform .34s cubic-bezier(.22,.9,.3,1);display:flex;flex-direction:column;
  box-shadow:0 -12px 40px -14px rgba(60,55,50,.3);
}
.sheet.on{transform:none;}
.sheet-bar{width:38px;height:4px;border-radius:3px;background:var(--line);margin:9px auto 0;flex:0 0 auto;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 8px;flex:0 0 auto;}
.sheet-head h3{margin:0;font-size:16px;font-weight:660;}
.sheet-x{color:var(--ink-3);font-size:16px;width:28px;height:28px;border-radius:9px;background:var(--card);}
.sheet-body{padding:4px 18px calc(20px + env(safe-area-inset-bottom));overflow-y:auto;}

/* Toast */
.toast{
  position:absolute;left:50%;bottom:88px;transform:translate(-50%,14px);z-index:60;
  background:rgba(64,60,55,.93);color:#F7F4EF;padding:10px 18px;border-radius:13px;
  font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.28s;white-space:nowrap;max-width:88%;
}
.toast.on{opacity:1;transform:translate(-50%,0);}

/* 打卡完成动画 */
@keyframes pop{0%{transform:scale(1);}45%{transform:scale(1.16);}100%{transform:scale(1);}}
.pop{animation:pop .4s ease;}

/* ============ 应用锁 ============ */
.lock-layer{
  position:absolute;inset:0;z-index:30;display:none;
  background:linear-gradient(160deg,#EDE9E2 0%,#E2E6E3 50%,#E8E0DA 100%);
  align-items:center;justify-content:center;padding:24px;
}
.lock-layer.on{display:flex;}
.lock-inner{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;text-align:center;animation:rise .4s both;}
.lock-inner.wrong{animation:lockShake .42s;}
.lock-ava{width:64px;height:64px;border-radius:22px;background:linear-gradient(140deg,var(--clay),var(--sand));color:#fff;display:grid;place-items:center;font-size:26px;font-weight:600;box-shadow:0 8px 22px -8px rgba(201,164,146,.7);margin-bottom:14px;}
.lock-hi{margin:0;font-size:20px;font-weight:680;color:var(--ink);}
.lock-sub{margin:6px 0 0;font-size:12.5px;color:var(--ink-3);}
.lock-dots{display:flex;gap:11px;justify-content:center;margin:20px 0 26px;}
.lock-dots i{width:13px;height:13px;border-radius:50%;background:var(--line);transition:.18s;}
.lock-dots i.on{background:var(--ink);transform:scale(1.06);}
.lock-kp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:264px;}
.lkp{height:58px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-size:22px;font-weight:600;color:var(--ink);box-shadow:var(--sh);transition:.14s;}
.lkp:active{transform:scale(.94);background:var(--card-2);}
.lkp-x{font-size:20px;color:var(--ink-2);}
.lkp-go{background:var(--ink);color:#F7F4EF;font-size:15px;font-weight:650;}
.lock-forgot{margin-top:22px;font-size:12px;color:var(--ink-3);text-decoration:underline;background:none;}
@keyframes lockShake{0%,100%{transform:translateX(0);}20%{transform:translateX(-9px);}40%{transform:translateX(9px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}}

/* ============ 碎碎念 ============ */
.muse-compose .chips{display:flex;gap:7px;flex-wrap:wrap;}
.muse-compose textarea{min-height:78px;resize:vertical;line-height:1.6;}
.muse-actions{display:flex;align-items:center;gap:10px;margin-top:11px;}
.muse-prev{position:relative;margin-top:11px;}
.muse-prev-img{display:block;width:100%;max-height:200px;object-fit:cover;border-radius:var(--r-m);border:1px solid var(--line-2);}
.muse-prev-x{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:rgba(76,72,66,.6);color:#fff;font-size:13px;display:grid;place-items:center;}
.muse-prev-x:active{transform:scale(.9);}

.muse-card{background:var(--card-2);border:1px solid var(--line-2);border-radius:var(--r-m);padding:12px 13px;margin-bottom:10px;}
.muse-card:last-child{margin-bottom:0;}
.muse-head{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.muse-head .pill{font-size:10.5px;font-weight:650;padding:2.5px 9px;border-radius:20px;}
.muse-time{font-size:11px;color:var(--ink-3);flex:1;}
.muse-text{font-size:14px;line-height:1.72;color:var(--ink);white-space:pre-wrap;word-break:break-word;}
.muse-ph{margin-top:9px;border-radius:var(--r-s);overflow:hidden;background:var(--bg-2);display:flex;align-items:center;justify-content:center;min-height:64px;}
.muse-ph .em{color:var(--ink-4);font-size:13px;}
.muse-img{display:block;width:100%;max-height:260px;object-fit:cover;}

/* ============ 复盘归档 / 回顾 ============ */
.rv-row{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line-2);cursor:pointer;}
.rv-row:last-child{border-bottom:none;}
.rv-row:active{background:var(--card-2);}
.rv-em{font-size:22px;width:30px;text-align:center;flex:0 0 auto;}
.rv-mid{flex:1;min-width:0;}
.rv-mid b{font-size:14px;font-weight:600;color:var(--ink);}
.rv-mid span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px;letter-spacing:.5px;}
.rv-go{color:var(--ink-3);font-size:20px;flex:0 0 auto;}
.rv-q{margin-top:13px;}
.rv-q h4{font-size:13px;color:var(--ink-2);margin:0 0 5px;font-weight:650;}
.rv-p{font-size:13.5px;line-height:1.7;color:var(--ink);margin:3px 0;white-space:pre-wrap;word-break:break-word;}
.rev-stat{display:flex;gap:8px;margin:2px 0 4px;}
.rev-stat>div{flex:1;text-align:center;background:var(--bg);border-radius:12px;padding:12px 4px;}
.rev-stat b{display:block;font-size:20px;color:var(--ink);font-weight:700;}
.rev-stat span{font-size:11px;color:var(--ink-3);}
.rev-note{margin-top:13px;font-size:14.5px;line-height:1.85;color:var(--ink);background:var(--bg);border-radius:14px;padding:14px 15px;border:1px solid var(--line-2);}

<script>window.__EMBEDDED__ = {"newsCache":{"date":"2026-08-05","note":"每天 08:30 自动更新。每条后面都会附一句「这跟你有什么关系」。","items":[{"t":"央行今日开展 5000 亿元买断式逆回购","d":"期限 3 个月，本月有 3000 亿元到期，净投放 2000 亿元，连续两个月净投放。｜与你有关：市场上的钱变宽松，货币基金和银行理财的收益率大概率继续走低，别把闲钱长期趴在活期里，可以看看 3–6 个月的定期或短债。"},{"t":"霍尔木兹海峡重开预期升温，国际油价暴跌超 6%","d":"美伊接连释放外交信号，美油主力跌 6.47% 报 75.14 美元/桶，布油跌 6% 报 78.74 美元。｜与你有关：这轮跌幅传导到国内需要一到两周，如果油箱还有大半，可以先别加满，等下一轮调价窗口。"},{"t":"创业板指单日大涨 5.64%，半导体领涨","d":"8 月 4 日深证成指涨 3.25%、创业板指涨 5.64%，元件、电子化学品、半导体涨幅居前，两市成交额 2.21 万亿元；银行、保险、旅游零售下跌。｜与你有关：科技板块已经连涨一段，这个位置追高风险不小，手上有科技类基金的可以考虑分批止盈，没有的别在情绪最热时一次性买入。"},{"t":"黄金逼近 4134 美元，白银大涨 3.27%","d":"黄金期货涨 1.07% 报 4134.20 美元/盎司，白银期货报 59.75 美元/盎司。｜与你有关：金价在高位，这时候买金饰或积存金的性价比不高；如果是长期定投黄金 ETF，坚持小额分批比一次性买入更稳。"},{"t":"宇树科技今日初步询价，8 月 10 日开放申购","d":"「人形机器人第一股」科创板 IPO，从受理到过会仅 73 天，创 2026 年最快纪录；预计上半年营收 10.52 亿–11.28 亿元。｜与你有关：8 月 10 日是网上申购日，有科创板权限的可以顺手打新，中签基本靠运气，不用为它专门加仓底仓。"},{"t":"自动驾驶 L3/L4 安全强制性国标发布","d":"GB 44721—2026 由市场监管总局批准发布，拟 2027 年 7 月 1 日起实施，适用于 L3、L4 级车辆，不含自动泊车。｜与你有关：如果近一两年打算买车，别为现在宣传的「高阶智驾」多付溢价，等 2027 年国标落地后合规车型才是真的有保障。"},{"t":"AI 大模型集体降价，入门款最高降 80%","d":"OpenAI 把 GPT-5.6 入门款输入价从 1 美元降到 0.2 美元/百万 Token；国产 DeepSeek-V4-Flash 单周调用量 7.22 万亿 Token 登顶全球第一。｜与你有关：AI 写文案、做选题、剪辑辅助的成本已经降到几乎可以忽略，现在是把 AI 工具纳入日常创作流程的好时机，不用再心疼额度。"},{"t":"7 月清理「AI 魔改」违规视频 1.33 万条","d":"广电总局通报，重点网络视听平台 7 月共清理违规视频 13300 余条、处置违规账号 30 余个，主要针对名著、历史、革命题材的 AI 二创。｜与你有关：做自媒体如果用 AI 改编影视片段或经典 IP，这条线现在踩不得，原创实拍和生活向内容才是安全区。"}]},"trendCache":{"date":"2026-08-04","note":"数据来源：8/1–8/4 小红书 / 抖音公开热榜与搜索样本。热度为平台展示值，非精确点赞数。「立秋3宝」「独居一人食」「便利店调酒」「5种存钱法」「一周早餐不重样」有公开数据支撑；雅思与复盘方向的选题属于「结构可迁移」的推测，非已验证爆款，已在描述中注明来源结构。建议每天只挑 1 条图文 + 1 条视频执行。近期节点：8/7 立秋、8/8 全民健身日、8/19 七夕、8/23 处暑。","xhs":[{"t":"# 立秋第一餐 / 立秋3宝","d":"8月4日「立秋3宝」（山药炒青椒、西芹炒百合、清炒莲藕）已在小红书健康类话题冲榜，立秋落在 8月7日 16:29，现在发正好卡在流量爬坡期。一条笔记只讲一道菜，封面用俯拍成品 + 左上角手写「立秋第一餐 ¥6.2」，正文按「食材 → 成本 → 3步做法」写，比三道菜全写更容易被收藏。"},{"t":"# 独居糊弄学 / 一个人吃饭的真实现场","d":"小红书 #独居生活 近90天热度增长 4亿+，风向已从「精致摆盘」转向「自在干饭」——有博主直接端着锅吃饭，单篇互动 17万+，热评「我甚至站在灶台边就吃完了」获赞 6.8万。反精致就是当下的流量点：封面直接拍没洗的锅和站着吃的画面，标题写「今天也没有好好吃饭（但很快乐）」。"},{"t":"# 365天随机存钱表","d":"5 种存钱法（631 分配法、12 存单法、52 周阶梯、账户隔离、365 随机）近期在小红书刷屏，其中 365 天随机存钱表打卡率最高。做法：打印 1–365 数字表，每天随机划掉一个数字并存入对应金额。封面拍划了一半的表格 + 马克笔，标题带具体进度（「已划掉 87 天，存下 4326 元」）比「教你存钱」点击率高一个量级。"},{"t":"# 准大学生开学准备","d":"8月起开学季内容已进入小红书主流量池，且方向从「买什么」转向「入学前要办完的事」。浅浅的差异化角度是「毕业生回头看的开学清单」——写当年踩过的坑：证件照要拍几版、哪些东西买了一次没用过、宿舍先占什么位置。封面用带勾选框的清单截图，比推荐好物更有说服力也更省钱。"},{"t":"# 雅思阶段性通关凭证","d":"8月2日小红书热榜出现「成果凭证化」结构（#拼豆上也可以作画了 热度 833.1w，爆款样本是自制「拼豆研究生录取通知书」，文案写「恭喜上岸，解锁高阶玩法」）。这个结构可直接搬到备考：把每周成果做成一张「阶段通关证书」图，标题「恭喜自己解锁听力 7.0，第 14 周」。仪式感 + 进度感双拉满，适合做成长期系列。"},{"t":"# 一周饭不重样","d":"8月1日「省妈一周早餐不重样」拿到 4.8万赞、1.6万收藏、3599 转发，收藏远高于点赞，说明这是典型的「备忘录型内容」。关键在把条件写死：几个人吃、准备多久、能不能提前做、食材怎么替换。浅浅做单人版「一周晚饭不重样」，九宫格封面每格标价格，收藏率会很稳。"}],"dy":[{"t":"沉浸式立秋备餐","d":"立秋 8月7日，抖音健康饮食流量已在爬升。全程无口播，只留切菜、下锅的原声，字幕标「立秋第 1 餐 / 山药炒青椒 / ¥6.2」。开头 3 秒直接给食材下锅的滋啦声，砍掉所有自我介绍，完播率会明显高一档。"},{"t":"便利店冰杯特调（无酒精版）","d":"抖音「便利店调酒」话题播放量已破 51.6亿次，冰杯销量连续两年增速超 300%。浅浅做无酒精版更贴合人设也更安全：冰杯 + 气泡水 + 果汁，固定机位俯拍，一条视频连拍 3 种配方，结尾字幕给单杯成本。避开酒精内容既不踩限流也不掉粉。"},{"t":"存钱挑战 Day N（进度可视化）","d":"存钱类是抖音的长线留存款式。固定模板：前 3 秒先给存钱罐或表格特写并报出当前总额，中段讲这周多存/少存的原因，最后 1 秒把累计数字放大定格。第 10 期之后主页会自然形成「追更」效果，老粉回访率明显上升。"},{"t":"AI 帮我做备考计划实测","d":"8月4日抖音热榜有「AI 一键生成的作品算艺术吗」（北京日报，889万热度），AI 话题正在讨论高峰。蹭大势要落到具体：录屏让 AI 出一份雅思四周计划，然后逐条标注「这条能用 / 这条离谱」，把结论放在开头 5 秒。实测类内容的收藏率通常是点赞的 2–3 倍。"},{"t":"主语倒置叙事结构","d":"8月2日小红书热榜 #我的家庭旅行更像是打副本 热度 812w，核心结构是「不写我做了什么，写事情反过来支配了我」。搬到抖音复盘内容：「我以为我在记账，结果是账本在管我」——开头交代原计划，中段拍现实打脸，结尾落一句结论。这个结构对复盘赛道特别好用。"},{"t":"30 秒一个雅思口语句式","d":"固定片头 + 固定版式是知识类短视频最稳的打法。每条只讲一个句式，结构：考官会怎么问 → 句式 → 一个自己的例句 → 重复一遍。片尾统一标「第 N 个」，用户会为了集齐而关注。图文稿可以和小红书共用一套，边际成本几乎为零。"}],"script":{"title":"今日拆解范例：小红书《独居一个人吃饭，端着锅就解决了》（互动 17w+，单条热评 6.8w 赞）","rows":[{"p":"0–3s","c":"手直接把锅从灶上端下来，镜头有点晃、画面不精致，字幕只有五个字「今天不摆盘」","w":"反精致开场。这个赛道的用户已经对完美餐桌免疫了，「不体面」本身就是钩子，3 秒内建立「她跟我一样」的认同"},{"p":"3–8s","c":"拉到远景，露出乱糟糟的灶台和只有一个人的厨房，画外音一句「一个人做饭，洗碗才是最烦的」","w":"先说痛点再给方案。把「为什么要一锅出」的动机交代清楚，后面的操作才有被看完的理由"},{"p":"8–35s","c":"一口锅完成全部步骤：下油、下菜、加水、下面，中间不切镜头只做变速，右下角常驻成本计数器从 ¥0 累加到 ¥7.5","w":"长镜头 + 不换锅，视觉上直接证明「真的只用一个锅」。成本计数器是持续的注意力锚点，很多人会为了看最终数字留到最后"},{"p":"35–45s","c":"锅端到桌上，人直接站着吃第一口，满足地眯眼，字幕「就这样吃完了，也没关系」","w":"情绪峰值，也是全片截图率最高的一帧。6.8 万赞的那条热评就是接在这个情绪点上冒出来的"},{"p":"45–50s","c":"画面定格在空锅上，字幕「你最邋遢的一顿饭是什么样的？」","w":"把提问设计成「晒糗」而不是「求教」。门槛低、有安全感，用户愿意主动暴露真实生活，评论区自然跑得起来"}]}},"podcastCache":{"date":"2026-08-05","note":"每天 09:00 自动更新。挑几档适合今天听的，配一句「为什么今天听它」。","theme":"通勤磨耳朵、做号找灵感，今天挑点能直接用的","items":[{"t":"无人知晓","host":"孟岩","tag":"理财","where":"小宇宙","d":"孟岩聊普通人的财务自由与人生选择，真诚不鸡血，适合打理财底子。","why":"你正在学理财，这档帮你建立长期视角，别一上来就只盯涨跌。"},{"t":"The English We Speak","host":"BBC Learning English","tag":"英语","where":"苹果播客","d":"每期一个地道习语加情景对话，短小好记，口语表达利器。","why":"做家务时听两遍，雅思口语和自媒体文案里的地道表达都能直接搬。"},{"t":"硬地骇客","host":"独立开发者","tag":"科技","where":"小宇宙","d":"独立开发者聊从 0 到 1 做产品，真实踩坑与变现经验。","why":"你做生活类自媒体正需要这种小步快跑的思路，听别人怎么冷启动。"},{"t":"得意忘形","host":"Steve 与小伙伴","tag":"成长","where":"小宇宙","d":"聊自我认知、亲密关系与生活哲学，松弛又有料，常听常新。","why":"备考雅思加搞副业容易焦虑，这档帮你把节奏稳住、别内耗。"}]},"wordCache":{"date":"2026-08-05","note":"新的一天，先把脸转向光。","item":{"type":"en-quote","text":"Keep your face always toward the sunshine—and shadows will fall behind you.","author":"Walt Whitman","zh":"始终面向阳光，影子自会落在身后。"}}};</script>

    const h = new Date().getHours();
    if(h<6) return "夜深了，早点休息";
    if(h<11) return "早安，新的一天开始了";
    if(h<14) return "中午好，记得好好吃饭";
    if(h<18) return "下午好，再坚持一下";
    if(h<22) return "晚上好，今天辛苦啦";
    return "该收工了，明天见";
  }

  /* ---------- 每日固定伪随机 ---------- */
  function pick(arr, salt){
    if(!arr || !arr.length) return null;
    const n = dayNum() * 31 + (salt||0) * 977 + d.seedOffset * 13;
    return arr[Math.abs(n) % arr.length];
  }
  function pickIdx(len, salt){
    const n = dayNum() * 31 + (salt||0) * 977 + d.seedOffset * 13;
    return Math.abs(n) % len;
  }
  function pickMany(arr, count, salt){
    const out = [], used = new Set();
    let i = 0;
    while(out.length < Math.min(count, arr.length) && i < arr.length*4){
      const k = Math.abs(dayNum()*17 + (salt||0)*613 + i*401 + d.seedOffset*7) % arr.length;
      if(!used.has(k)){ used.add(k); out.push(arr[k]); }
      i++;
    }
    return out;
  }

  /* ---------- 待办 ---------- */
  function todos(date){ const k = date||today(); if(!d.todos[k]) d.todos[k]=[]; return d.todos[k]; }
  function addTodo(t, pri){
    if(!t.trim()) return;
    todos().push({ id:Date.now()+""+Math.floor(Math.random()*99), t:t.trim(), pri:pri||"normal", done:false });
    save();
  }
  function toggleTodo(id){
    const a = todos(), it = a.find(x=>x.id===id);
    if(it){ it.done = !it.done; if(it.done) addCoin(5,"完成待办"); save(); }
  }
  function delTodo(id){ d.todos[today()] = todos().filter(x=>x.id!==id); save(); }

  /* ---------- 积分 ---------- */
  function addCoin(n, why){
    d.coins += n; save();
    checkBadges();
    if(window.UI) UI.coinPop(n, why);
  }
  function level(){
    const c = d.coins;
    const lv = Math.floor(Math.sqrt(c/40)) + 1;
    const cur = Math.pow(lv-1,2)*40, next = Math.pow(lv,2)*40;
    const names = ["新生玩家","见习居民","日常修行者","生活策划师","时间管理员","自律主理人","人生规划师","地球观察员","高阶玩家","传说居民"];
    return { lv, name: names[Math.min(lv-1, names.length-1)], cur, next, pct: Math.min(100, Math.round((c-cur)/(next-cur)*100)) };
  }

  /* ---------- 连续打卡 ---------- */
  function checkIn(){
    const t = today();
    if(d.lastCheck === t) return d.streak;
    const y = new Date(); y.setDate(y.getDate()-1);
    d.streak = (d.lastCheck === ymd(y)) ? d.streak+1 : 1;
    d.lastCheck = t; save(); checkBadges();
    return d.streak;
  }

  /* ---------- 徽章 ---------- */
  function checkBadges(){
    const got = new Set(d.badges);
    const add = id => { if(!got.has(id)){ d.badges.push(id); got.add(id); if(window.UI) UI.toast("🏅 解锁成就：" + (DB.badges.find(b=>b.id===id)||{}).n); } };
    const doneCount = Object.values(d.questDone).reduce((s,a)=>s+a.length,0);
    if(doneCount>=1) add("b_first");
    if(d.coins>=100) add("b_100");
    if(d.coins>=500) add("b_500");
    if(d.coins>=1000) add("b_1000");
    if(d.streak>=3) add("b_streak3");
    if(d.streak>=7) add("b_streak7");
    if(d.streak>=30) add("b_streak30");
    if(d.bills.length>=10) add("b_ledger");
    if(Object.keys(d.bookLog).length>=7) add("b_book");
    if(Object.values(d.wordBox).filter(w=>w.lvl>=2).length>=50) add("b_word");
    if(Object.values(d.photos).reduce((s,a)=>s+a.length,0)>=5) add("b_cook");
    if(d.posts.length>=10) add("b_post");
    if((d.muses||[]).length>=30) add("b_muse");
    save();
  }

  /* ---------- 账单统计 ---------- */
  function monthBills(ymStr){
    const ym = ymStr || today().slice(0,7);
    return d.bills.filter(b=>b.date.slice(0,7)===ym);
  }
  function sum(list, type){ return list.filter(b=>b.type===type).reduce((s,b)=>s+Number(b.amt),0); }

  /* ---------- 存款储蓄 ---------- */
  function sv(){ if(!d.savings) d.savings = { balance:0, goal:0, salaryDay:15, log:[] }; return d.savings; }
  function addSaving(amt, note, dir){
    amt = Number(amt);
    if(!amt || amt<=0) return false;
    const s = sv();
    s.balance = Math.max(0, (s.balance||0) + (dir==="out" ? -amt : amt));
    s.log = s.log || [];
    s.log.unshift({ id:Date.now()+"", date:today(), dir:dir==="out"?"out":"in", amt, note:(note||"").trim() });
    save(); return true;
  }
  function setSalaryDay(n){ n = Number(n); if(n>=1 && n<=28){ sv().salaryDay = n; save(); } }
  function setGoal(g){ g = Number(g); if(g>=0){ sv().goal = g; save(); } }
  function daysToSalary(){
    const s = (sv().salaryDay)||15;
    const t = new Date(), y = t.getFullYear(), m = t.getMonth();
    let next = new Date(y, m, s);
    if(next < t) next = new Date(y, m+1, s);
    return Math.max(0, Math.round((next - t)/86400000));
  }

  /* ---------- 图片存储（IndexedDB，file:// 下回退 localStorage base64） ---------- */
  const LS_PHOTO_PREFIX = "qq_photo_";
  let dbp = null, _idbOk = true;
  function blobToB64(blob){
    return new Promise((res,rej)=>{
      const fr = new FileReader();
      fr.onload = ()=>res(String(fr.result).split(",")[1]);
      fr.onerror = ()=>rej(new Error("read fail"));
      fr.readAsDataURL(blob);
    });
  }
  function b64ToBlob(b64, type){
    try{
      const bin = atob(b64), len = bin.length, arr = new Uint8Array(len);
      for(let i=0;i<len;i++) arr[i] = bin.charCodeAt(i);
      return new Blob([arr], { type: type||"image/jpeg" });
    }catch(e){ return null; }
  }
  function idb(){
    if(!_idbOk) return Promise.reject(new Error("idb disabled"));
    if(dbp) return dbp;
    dbp = new Promise((res,rej)=>{
      try{
        if(!window.indexedDB){ _idbOk=false; rej(new Error("no idb")); return; }
        const r = indexedDB.open("qianqian_photos", 1);
        r.onupgradeneeded = e => { e.target.result.createObjectStore("img"); };
        r.onsuccess = e => res(e.target.result);
        r.onerror = ()=>{ _idbOk=false; rej(new Error("open fail")); };
      }catch(e){ _idbOk=false; rej(e); }
    });
    return dbp;
  }
  async function putImg(id, blob){
    try{
      const db = await idb();
      await new Promise(res=>{ const tx=db.transaction("img","readwrite"); tx.objectStore("img").put(blob,id); tx.oncomplete=()=>res(); tx.onerror=()=>res(); });
      return true;
    }catch(e){
      // 回退：localStorage 存 base64
      try{ const b64 = await blobToB64(blob); localStorage.setItem(LS_PHOTO_PREFIX+id, b64); return true; }catch(_){ return false; }
    }
  }
  async function getImg(id){
    try{
      const db = await idb();
      const r = await new Promise(res=>{ const tx=db.transaction("img","readonly"); const q=tx.objectStore("img").get(id); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); });
      if(r) return r;
    }catch(e){}
    // 回退：localStorage
    try{ const b64 = localStorage.getItem(LS_PHOTO_PREFIX+id); if(b64){ const b=b64ToBlob(b64); if(b) return b; } }catch(e){}
    return null;
  }
  async function delImg(id){
    try{ const db=await idb(); const tx=db.transaction("img","readwrite"); tx.objectStore("img").delete(id); }catch(e){}
    try{ localStorage.removeItem(LS_PHOTO_PREFIX+id); }catch(e){}
  }

  /* 通用：把图片文件压缩成适合存储的 blob（复用于餐桌/碎碎念） */
  function compressImage(file){
    return new Promise(res=>{
      const img = new Image();
      img.onload = ()=>{
        const max = 1100;
        let w = img.width, h = img.height;
        if(w>max || h>max){ const r = Math.min(max/w, max/h); w = w*r|0; h = h*r|0; }
        try{
          const cv = document.createElement("canvas"); cv.width=w; cv.height=h;
          cv.getContext("2d").drawImage(img,0,0,w,h);
          cv.toBlob(b=>res(b||file), "image/jpeg", .82);
        }catch(e){ res(file); }
      };
      img.onerror = ()=>res(file);
      img.src = URL.createObjectURL(file);
    });
  }

  /* ---------- 碎碎念（记录身边的事） ---------- */
  function museList(){
    return (d.muses||[]).slice().sort((a,b)=>b.ts-a.ts);
  }
  async function addMuse(text, type, blob){
    const known = ["note","complain","beauty","photo"];
    type = known.includes(type) ? type : "note";
    const entry = { id:"m"+Date.now()+""+Math.floor(Math.random()*99), ts:Date.now(), date:today(), type, text:(text||"").trim(), photoId:null };
    if(blob){
      try{
        const b = await compressImage(blob);
        const id = "mp"+Date.now()+""+Math.floor(Math.random()*99);
        await putImg(id, b);
        entry.photoId = id;
      }catch(e){}
    }
    d.muses = d.muses || [];
    d.muses.push(entry);
    save();
    checkBadges();
    addCoin(3, "记录碎碎念");
    return entry;
  }
  async function delMuse(id){
    const m = (d.muses||[]).find(x=>x.id===id);
    if(m && m.photoId) await delImg(m.photoId);
    d.muses = (d.muses||[]).filter(x=>x.id!==id);
    save();
  }

  /* ---------- 远程每日推送 ---------- */
  async function fetchDaily(){
    const get = async (p, cacheKey, fb) => {
      // 单文件 / 离线模式：优先使用内嵌数据（无需 fetch）
      if(window.__EMBEDDED__ && window.__EMBEDDED__[cacheKey]){
        try{ const j = window.__EMBEDDED__[cacheKey]; d[cacheKey] = j; save(); return j; }catch(e){}
      }
      try{
        // 6 秒超时保护：避免 fetch 在某些本地 / 预览环境下永远 pending 而卡死界面
        let ctrl = null, to = null;
        if(typeof AbortController !== "undefined"){
          ctrl = new AbortController();
          to = setTimeout(()=>{ try{ ctrl.abort(); }catch(e){} }, 6000);
        }
        const r = await fetch(p + "?t=" + Date.now(), { cache:"no-store", signal: ctrl?ctrl.signal:undefined });
        if(to) clearTimeout(to);
        if(!r.ok) throw 0;
        const j = await r.json();
        // news/trend/podcast 数据用 items/xhs 字段判定
        if(j && (j.items || j.xhs)){ d[cacheKey] = j; save(); return j; }
        throw 0;
      }catch(e){ return d[cacheKey] || fb; }
    };
    async function fetchWord(){
      const sb = getSupa();
      if(sb){
        try{
          const { data, error } = await sb.from("app_state").select("data").eq("id","daily_word").maybeSingle();
          if(!error && data && data.data && data.data.item){
            d.wordCache = data.data; save();
            return data.data;
          }
        }catch(e){}
      }
      return await get("data/daily/word-latest.json","wordCache", DB.fallbackWord);
    }
    const [news, trend, podcast, word] = await Promise.all([
      get("data/daily/news-latest.json","newsCache", DB.fallbackNews),
      get("data/daily/trends-latest.json","trendCache", DB.fallbackTrends),
      get("data/daily/podcasts-latest.json","podcastCache", DB.fallbackPodcasts),
      fetchWord()
    ]);
    return { news, trend, podcast, word };
  }

  function reset(){ localStorage.removeItem(KEY); location.reload(); }
  function exportData(){ return JSON.stringify(d, null, 2); }
  function importData(txt){
    try{ const o = JSON.parse(txt); d = Object.assign(JSON.parse(JSON.stringify(defaults)), o); save(); return true; }
    catch(e){ return false; }
  }

  /* ---------- 云同步实现 ---------- */
  function normURL(u){
    u = (u || "").trim();
    if(!u) return "";
    if(!/^https?:\/\//i.test(u)) u = "http://" + u;
    return u.replace(/\/+$/, "");
  }
  /* ---------- Supabase 同步后端（多设备共享同一张表 = 自动互通） ---------- */
  const SUPABASE_URL  = "https://qjpirlacyxrnfruvwguv.supabase.co";
  const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFqcGlybGFjeXhybmZydXZ3Z3V2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NzQ2MzgsImV4cCI6MjEwMTQ1MDYzOH0.r4EaveGbgOdXcCs9gfUayGrenxE6eQ0CgJVB4Wt6vmI";
  const SB_ROW = "global";
  let _sb = null;
  function getSupa(){
    if(_sb !== null) return _sb;
    try{
      if(typeof window !== "undefined" && window.supabase && window.supabase.createClient){
        _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, { auth:{ persistSession:false, autoRefreshToken:false } });
      } else { _sb = false; }
    }catch(e){ _sb = false; }
    return _sb;
  }
  function syncEnabled(){ return !!getSupa(); }

  function getSyncURL(){ return syncURL; }
  function syncInfo(){ return { url: syncEnabled() ? SUPABASE_URL : "", at:lastSyncAt }; }

  function schedulePush(){
    if(!syncEnabled()) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushSync, 800);   // 防抖：连续改动只推一次
  }
  async function pushSync(){
    const sb = getSupa(); if(!sb) return;
    const at = Date.now();
    try{
      const { error } = await sb.from("app_state").upsert({ id: SB_ROW, data: d, updated_at: new Date(at).toISOString() });
      if(!error){ lastSyncAt = at; try{ localStorage.setItem(SYNC_AT_KEY, String(at)); }catch(e){} }
    }catch(e){ /* 离线则静默失败，下次保存再推 */ }
  }
  async function pullRaw(){
    const sb = getSupa(); if(!sb) return null;
    try{
      const { data, error } = await sb.from("app_state").select("data,updated_at").eq("id", SB_ROW).maybeSingle();
      if(error || !data) return null;
      const raw = data.updated_at || "";
      // Supabase 返回的 updated_at 形如 "2026-08-05T02:32:24.289+00:00"（带偏移量、不以 Z 结尾）。
      // 直接给偏移量时间戳加 "Z" 会变成 "...+00:00Z"，被 Date 解析为 NaN —— 曾导致 pull 永不触发、双端无法同步。
      // 用 Date.parse 同时兼容 "+00:00" 与 "Z" 两种写法。
      const at = raw ? (Date.parse(raw) || new Date(raw).getTime() || 0) : 0;
      return { at, state: data.data };
    }catch(e){ return null; }
  }
  async function testSupa(){
    const r = await pullRaw();
    return r !== null;
  }
  async function pullSync(){
    if(!syncEnabled()) return;
    const j = await pullRaw();
    if(j && j.at && j.at > lastSyncAt){
      d = Object.assign(JSON.parse(JSON.stringify(defaults)), j.state || {});
      lastSyncAt = j.at;
      try{ localStorage.setItem(SYNC_AT_KEY, String(lastSyncAt)); }catch(e){}
      persist();
      if(window.UI) UI.toast("☁️ 已同步到最新数据");
      if(window.App) App.refresh();
    }
  }
  async function connectSync(){
    if(!syncEnabled()) return;
    const raw = await pullRaw();
    const localFresh = (lastSyncAt === 0);
    if(!raw || !raw.at){ await pushSync(); return; }       // 无远程数据：本机作为种子上传
    const remoteState = raw.state || {};
    const remoteEmpty = Object.keys(remoteState).length === 0;
    if(localFresh){
      if(remoteEmpty){ await pushSync(); }                  // 云端只有空占位 → 本机数据上传
      else { d = Object.assign(JSON.parse(JSON.stringify(defaults)), remoteState); lastSyncAt = raw.at; try{ localStorage.setItem(SYNC_AT_KEY, String(lastSyncAt)); }catch(e){} persist(); }
    } else {
      if(raw.at > lastSyncAt){ d = Object.assign(JSON.parse(JSON.stringify(defaults)), remoteState); lastSyncAt = raw.at; try{ localStorage.setItem(SYNC_AT_KEY, String(lastSyncAt)); }catch(e){} persist(); }
      else if(raw.at < lastSyncAt){ await pushSync(); }
    }
  }
  async function setSyncURL(u){
    if(!u){ syncURL = ""; lastSyncAt = 0; try{ localStorage.removeItem(SYNC_URL_KEY); localStorage.removeItem(SYNC_AT_KEY); }catch(e){} return; }
    syncURL = "supabase"; try{ localStorage.setItem(SYNC_URL_KEY, syncURL); }catch(e){}
    if(syncEnabled()){ await connectSync(); if(window.App) App.refresh(); }
  }
  // 自动开启：检测到 Supabase 环境即连接共享表，多设备打开任意一端自动互通（零配置）
  async function autoDetectSync(){
    if(syncURL) return;
    if(!syncEnabled()) return;
    syncURL = "supabase"; try{ localStorage.setItem(SYNC_URL_KEY, syncURL); }catch(e){}
  }
  let _rtCh = null;
  function subscribeRealtime(){
    const sb = getSupa(); if(!sb || _rtCh) return;
    try{
      _rtCh = sb.channel("app_state_global").on(
        "postgres_changes",
        { event:"UPDATE", schema:"public", table:"app_state", filter:"id=eq." + SB_ROW },
        () => { pullSync(); }
      ).subscribe();
    }catch(e){ _rtCh = null; }
  }
  async function initSync(){
    await autoDetectSync();
    if(!syncEnabled()) return;
    await connectSync();            // 启动时先拉取/上传种子
    setInterval(pullSync, 20000);   // 每 20 秒拉一次，保证多端近实时
    subscribeRealtime();            // 实时推送（表已加入 supabase_realtime publication）
  }

  /* ---------- 应用锁 ---------- */
  function hashPin(p){
    let h = 5381;
    for(let i=0;i<p.length;i++){ h = ((h<<5)+h + p.charCodeAt(i)) >>> 0; }
    return "p" + h.toString(36);
  }
  function lockEnabled(){ return !!(d.lock && d.lock.enabled); }
  function setPin(p){ d.lock = d.lock || { enabled:false, pin:"" }; d.lock.enabled = true; d.lock.pin = hashPin(p); save(); }
  function verifyPin(p){ return !!(d.lock && d.lock.pin) && d.lock.pin === hashPin(p); }
  function disableLock(){ if(!d.lock) d.lock = { enabled:false, pin:"" }; d.lock.enabled = false; d.lock.pin = ""; save(); }
  function changePin(oldP, newP){ if(!verifyPin(oldP)) return false; d.lock.pin = hashPin(newP); save(); return true; }

  return { get d(){return d;}, save, persist, today, ymd, dayNum, prettyDate, greet,
           pick, pickIdx, pickMany, todos, addTodo, toggleTodo, delTodo,
           addCoin, level, checkIn, checkBadges, monthBills, sum,
           sv, addSaving, setSalaryDay, setGoal, daysToSalary,
           putImg, getImg, delImg, compressImage, fetchDaily, reset, exportData, importData,
           museList, addMuse, delMuse,
           normURL, getSyncURL, syncInfo, pushSync, pullSync, connectSync, setSyncURL, initSync, testSupa,
           lockEnabled, setPin, verifyPin, disableLock, changePin };
})();

<script>
/* ============ UI 工具 ============ */
window.UI = (function () {
  const $ = s => document.querySelector(s);
  const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  let toastTimer;
  function toast(msg){
    const t = $("#toast"); if(!t) return;
    t.textContent = msg; t.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove("on"), 1900);
  }
  function coinPop(n, why){
    toast("+" + n + " 积分 · " + (why||"打卡"));
    const el = $("#coinNum");
    if(el){ el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
    syncCoin();
  }
  function syncCoin(){ const el = $("#coinNum"); if(el) el.textContent = S.d.coins; }

  /* 底部弹层 */
  function sheet(title, html, onOpen){
    $("#sheetTitle").textContent = title;
    $("#sheetBody").innerHTML = html;
    $("#sheet").classList.add("on");
    $("#sheetMask").classList.add("on");
    if(onOpen) setTimeout(onOpen, 40);
  }
  function closeSheet(){
    $("#sheet").classList.remove("on");
    $("#sheetMask").classList.remove("on");
  }

  /* 环形进度 */
  function ring(pct, size, color){
    size = size || 66; color = color || "#8FA98E";
    const r = size/2 - 5, c = 2*Math.PI*r;
    return `<div class="ring" style="width:${size}px;height:${size}px">
      <svg width="${size}" height="${size}">
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="6"/>
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}"
          style="transition:stroke-dashoffset .7s cubic-bezier(.3,1,.4,1)"/>
      </svg>
      <div class="ring-txt">${Math.round(pct)}%</div></div>`;
  }

  /* 搜索链接 */
  const weread = t => "https://weread.qq.com/web/search/books?keyword=" + encodeURIComponent(t);
  const douban = t => "https://search.douban.com/book/subject_search?search_text=" + encodeURIComponent(t);
  const jd     = t => "https://search.jd.com/Search?keyword=" + encodeURIComponent(t);
  const xcf    = t => "https://www.xiachufang.com/search/?keyword=" + encodeURIComponent(t);

  /* 事件委托注册 */
  const handlers = {};
  function on(action, fn){ handlers[action] = fn; }
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]");
    if(!el) return;
    const fn = handlers[el.dataset.act];
    if(fn){ e.preventDefault(); fn(el, e); }
  });

  return { $, esc, toast, coinPop, syncCoin, sheet, closeSheet, ring, weread, douban, jd, xcf, on };
})();

</script>
<script>
/* ============ 今日页 ============ */
window.ViewToday = (function () {
  const { esc, ring } = UI;
  let dailyData = null;

  const WEEK = ["周日","周一","周二","周三","周四","周五","周六"];
  const MOODS = ["😌","🥰","😐","😮‍💨","🥲"];
  const MOOD_TXT = ["平静","满足","普通","疲惫","低落"];
  function dateStr(dt){
    return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
  }
  function pastDays(n){
    const out=[]; const now=new Date();
    for(let i=0;i<n;i++){ const dt=new Date(now); dt.setDate(now.getDate()-i); out.push(dateStr(dt)); }
    return out;
  }
  function savedReviews(){ return Object.keys(S.d.review).filter(k=>S.d.review[k]&&S.d.review[k].saved); }

  function render(){
    const t = S.today();
    const list = S.todos(t);
    const doneN = list.filter(x=>x.done).length;
    const pct = list.length ? doneN/list.length*100 : 0;
    const q = S.pick(DB.quotes, 1);
    const lv = S.level();
    const rv = S.d.review[t] || {};
    const quests = S.pickMany(DB.quests, 4, 5);
    const qDone = S.d.questDone[t] || [];

    return `
    <div class="hero-card">
      <div class="hero-top">
        <div style="flex:1;min-width:0">
          <div class="hero-date">${S.prettyDate()}</div>
          <h3 class="hero-h">${esc(S.greet())}</h3>
          <p class="hero-quote">${esc(q)}</p>
        </div>
        ${ring(pct, 66, "#8FA98E")}
      </div>
      <div class="hero-stats">
        <div><b>${S.d.streak}</b>连续打卡</div>
        <div><b>${doneN}/${list.length}</b>今日待办</div>
        <div><b>Lv.${lv.lv}</b>${esc(lv.name)}</div>
      </div>
    </div>

    <div class="grid3" style="margin-bottom:14px">
      ${quick("💰","记账","money")}
      ${quick("📖","阅读","learn")}
      ${quick("🍳","今日菜","life")}
    </div>

    <!-- 待办 -->
    <div class="card">
      <div class="sec-head">
        <h2><span class="dot" style="background:var(--sage)"></span>今日待办</h2>
        <span class="more">${doneN} / ${list.length} 已完成</span>
      </div>
      <div id="todoList">${list.length ? list.map(todoRow).join("") :
        `<div class="empty"><span class="em">🌿</span>还没有安排，写下今天最想做的三件事</div>`}</div>
      <div class="add-row">
        <input class="inp" id="todoInp" placeholder="添加一件今天要做的事…" />
        <button class="btn" data-act="addTodo">添加</button>
      </div>
      <div style="display:flex;gap:6px;margin-top:9px;flex-wrap:wrap">
        ${["读书 20 分钟","背 20 个雅思单词","记账","运动 20 分钟","剪一条视频"].map(s=>
          `<button class="lk" data-act="quickTodo" data-t="${esc(s)}">+ ${esc(s)}</button>`).join("")}
      </div>
    </div>

    <!-- 地球 Online 迷你 -->
    <div class="card">
      <div class="sec-head">
        <h2><span class="dot" style="background:var(--olive)"></span>地球 Online · 今日任务</h2>
        <span class="more" data-act="go" data-tab="life">全部 ›</span>
      </div>
      ${quests.slice(0,3).map(qq=>{
        const done = qDone.includes(qq.t);
        return `<div class="quest ${done?"done":""}">
          <div class="q-e">${qq.e}</div>
          <div class="q-b"><h5>${esc(qq.t)}</h5><p>${esc(qq.d)} · +${qq.p} 积分</p></div>
          <button class="q-go ${done?"done":""}" data-act="quest" data-q="${esc(qq.t)}" data-p="${qq.p}">${done?"已完成":"完成"}</button>
        </div>`;
      }).join("")}
    </div>

    <!-- 每日一句 -->
    <div class="card">
      <div class="sec-head">
        <h2><span class="dot" style="background:#C9A27E"></span>每日一句 · 08:30 更新</h2>
      </div>
      <div id="phraseBox"><div class="empty">正在读取今日一句…</div></div>
    </div>

    <!-- 每日新闻 -->
    <div class="card">
      <div class="sec-head">
        <h2><span class="dot" style="background:var(--mist)"></span>每日新闻 · 08:30 推送</h2>
        <span class="more" data-act="refreshNews">刷新</span>
      </div>
      <div id="newsBox"><div class="empty">正在读取今日推送…</div></div>
    </div>

    <!-- 每日复盘 -->
    <div class="card">
      <div class="sec-head">
        <h2><span class="dot" style="background:var(--clay)"></span>每日复盘</h2>
        <span class="more">${rv.saved ? "今天已复盘 ✓" : "睡前 5 分钟"}</span>
      </div>
      <div class="mood-row">
        ${[["😌","平静"],["🥰","满足"],["😐","普通"],["😮‍💨","疲惫"],["🥲","低落"]].map((m,i)=>
          `<button class="mood ${rv.mood===i?"on":""}" data-act="mood" data-i="${i}">
            <span class="e">${m[0]}</span><span class="l">${m[1]}</span></button>`).join("")}
      </div>
      <div class="rv-q">
        <h4>✅ 今天做成了什么？</h4>
        <textarea class="inp" id="rvGood" placeholder="哪怕只是按时起床、认真吃了一顿饭…">${esc(rv.good||"")}</textarea>
      </div>
      <div class="rv-q">
        <h4>🌀 哪里可以更好？</h4>
        <textarea class="inp" id="rvBad" placeholder="不用自责，只是观察">${esc(rv.bad||"")}</textarea>
      </div>
      <div class="rv-q">
        <h4>🎯 明天最重要的一件事</h4>
        <textarea class="inp" id="rvNext" placeholder="只写一件，写多了等于没写">${esc(rv.next||"")}</textarea>
      </div>
      <div class="rv-q">
        <h4>⭐️ 给今天打个分</h4>
        <div class="stars" id="stars">${[1,2,3,4,5].map(i=>
          `<span class="star ${(rv.score||0)>=i?"on":""}" data-act="star" data-i="${i}">★</span>`).join("")}</div>
      </div>
      <button class="btn block" data-act="saveReview" style="margin-top:6px">保存今日复盘 · +20 积分</button>
    </div>

    <!-- 最近复盘 -->
    ${recentReviews()}

    <!-- 回顾一下 -->
    ${reviewSummaryCard()}
    `;
  }

  function quick(e,l,tab){
    return `<button class="card tight" style="margin:0;text-align:center;padding:13px 4px" data-act="go" data-tab="${tab}">
      <div style="font-size:21px">${e}</div>
      <div style="font-size:11.5px;font-weight:650;color:var(--ink-2);margin-top:4px">${l}</div></button>`;
  }

  function todoRow(x){
    const priColor = { high:"#C0736F", normal:"#A3B4C2", low:"#C4BDB4" }[x.pri] || "#A3B4C2";
    const priTxt = { high:"重要", normal:"常规", low:"随缘" }[x.pri] || "常规";
    return `<div class="todo ${x.done?"done":""}">
      <div class="tbox ${x.done?"on":""}" data-act="toggleTodo" data-id="${x.id}"></div>
      <div class="todo-body">
        <div class="todo-t">${esc(x.t)}</div>
        <div class="todo-m"><span class="pill" style="background:${priColor}22;color:${priColor}">${priTxt}</span></div>
      </div>
      <button class="todo-x" data-act="delTodo" data-id="${x.id}">✕</button>
    </div>`;
  }

  function recentReviews(){
    const keys = Object.keys(S.d.review).filter(k=>S.d.review[k].saved).sort().reverse().slice(1,6);
    if(!keys.length) return "";
    const emo = ["😌","🥰","😐","😮‍💨","🥲"];
    return `<div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--lilac)"></span>最近复盘</h2>
        <span class="more" data-act="openAllReviews">查看全部 ›</span></div>
      ${keys.map(k=>{
        const r = S.d.review[k];
        return `<div class="news-i">
          <div class="news-n" style="background:var(--lilac-s);color:var(--lilac)">${emo[r.mood]||"·"}</div>
          <div class="news-b"><h5>${k.slice(5)} · ${"★".repeat(r.score||0)}</h5>
          <p>${esc((r.good||"").slice(0,52) || "（未填写）")}</p></div>
        </div>`;
      }).join("")}
    </div>`;
  }

  function reviewSummaryCard(){
    const total = savedReviews().length;
    if(!total) return "";
    const wk = pastDays(7).filter(k=>S.d.review[k]&&S.d.review[k].saved).length;
    const moPrefix = S.today().slice(0,7);
    const mo = savedReviews().filter(k=>k.startsWith(moPrefix)).length;
    return `<div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--sage)"></span>回顾一下</h2>
        <span class="more">已复盘 ${total} 天</span></div>
      <p class="tiny" style="margin:0 0 11px;line-height:1.6;color:var(--ink-3)">本周 ${wk} 天 · 本月 ${mo} 天。回头看看，你一直在往前走。</p>
      <div style="display:flex;gap:10px">
        <button class="btn" data-act="weekReview" style="flex:1">🗓 一周回看</button>
        <button class="btn ghost" data-act="monthReview" style="flex:1">🌙 月末小总结</button>
      </div>
    </div>`;
  }

  function reviewRecapBody(rs){
    const avg = (rs.reduce((a,r)=>a+(r.score||0),0)/rs.length).toFixed(1);
    const moodCount=[0,0,0,0,0]; rs.forEach(r=>{ if(r.mood>=0&&r.mood<5) moodCount[r.mood]++; });
    const topMood = moodCount.indexOf(Math.max.apply(null,moodCount));
    const goods = rs.map(r=>r.good).filter(Boolean).slice(0,3);
    const nexts = rs.map(r=>r.next).filter(Boolean).slice(0,3);
    return `
      <div class="rev-stat">
        <div><b>${rs.length}</b><span>复盘天数</span></div>
        <div><b>${avg}</b><span>平均评分</span></div>
        <div><b>${MOODS[topMood]}</b><span>主心情</span></div>
      </div>
      ${goods.length?`<div class="rv-q"><h4>✅ 这段日子你做成了</h4>${goods.map(g=>`<p class="rv-p">· ${esc(g.slice(0,60))}</p>`).join("")}</div>`:""}
      ${nexts.length?`<div class="rv-q"><h4>🎯 你立过的 flag</h4>${nexts.map(n=>`<p class="rv-p">· ${esc(n.slice(0,60))}</p>`).join("")}</div>`:""}
      <div class="scene-tip">每写下一天的复盘，都是在给未来的自己留一封信。继续呀。</div>`;
  }

  // 复盘完成后的个性化点评 / 鼓励（综合评分、心情、待办完成率、写了什么）
  function buildReviewNote(r, ctx){
    const score = r.score||0, mood = (typeof r.mood==="number"?r.mood:2);
    const good = (r.good||"").trim(), next = (r.next||"").trim();
    const total = ctx.total, doneN = ctx.doneN;
    const rate = total ? Math.round(doneN/total*100) : 0;
    const seed = (S.dayNum()%3);

    let open;
    if(mood===3||mood===4){
      open = [
        "今天辛苦了，允许自己先好好歇一口气。",
        "觉得累或低落的时候，还坐下来复盘，这本身就是一种温柔的勇敢。",
        "疲惫和低落都不是你的错，它们只是提醒你：该抱抱自己了。"
      ];
    } else if(score>=4){
      open = [
        "今天很不错呀，看得出来你是认真在生活的人。",
        "这一天被你过得有模有样，值得给自己鼓个掌。",
        "稳稳的一天，你又把想要的生活往前推了一点点。"
      ];
    } else if(score>=3){
      open = [
        "平平淡淡也是好日子，你把它稳稳接住了。",
        "不算惊艳，但真实又完整，这就够了。",
        "今天没崩，本身就已经是一种胜利。"
      ];
    } else {
      open = [
        "今天有点晃，但你还坐在这里复盘，这已经很了不起。",
        "乱一点没关系，明天是崭新的草稿。",
        "哪怕只做好了一件事，也值得被自己看见。"
      ];
    }
    const o = open[seed];

    let mid;
    if(total===0){
      mid = "今天没列待办也完全 OK，想做的事写下来，明天会轻盈一些。";
    } else if(rate>=80){
      mid = `今天待办完成了 ${rate}%，这份执行力就藏在这些小事里。`;
    } else if(rate>=50){
      mid = `待办完成了 ${rate}%，没做完的别急，它们会等到你的。`;
    } else {
      mid = `待办只完成了 ${rate}%，没关系——能写完这篇复盘，说明你没松开今天。`;
    }

    let goodLine = "";
    if(good){
      const g = good.slice(0,18);
      goodLine = `你写下的「${g}」，这样的小成就是一种底气，记得留住它。`;
    }

    let tail;
    if(next){
      tail = `明天最重要的事你心里已经有了：「${next.slice(0,16)}」。带着它，睡个好觉吧。`;
    } else {
      tail = "如果还没想好明天最重要的事，睡前挑一个最小的，明天会更容易开始。";
    }

    let bonus = "";
    if(ctx.streak>=3) bonus = ` 你已经连续打卡 ${ctx.streak} 天了，这份坚持本身就是光。`;

    return [o, mid, goodLine, tail, bonus].filter(Boolean).join(" ");
  }

  async function afterRender(){
    const box = document.getElementById("newsBox");
    if(!box) return;
    if(!dailyData) dailyData = await S.fetchDaily();
    // 每日一句
    const pbox = document.getElementById("phraseBox");
    if(pbox){
      const w = dailyData.word || DB.fallbackWord;
      const it = w.item || {};
      let h = "";
      if(w.date) h += `<div class="tiny" style="margin-bottom:8px;color:#8a8a85">📅 ${esc(w.date)} 推送</div>`;
      if(it.type === "en-quote"){
        h += `<div style="font-size:16px;line-height:1.7;font-weight:600;color:#3f3f3b">“${esc(it.text||"")}”</div>`;
        if(it.author) h += `<div style="margin-top:8px;color:#C9A27E;font-size:13px">— ${esc(it.author)}</div>`;
      } else if(it.text){
        h += `<div style="font-size:17px;line-height:1.8;font-weight:600;color:#3f3f3b">${esc(it.text)}</div>`;
      }
      if(it.zh) h += `<div style="margin-top:10px;font-size:14px;line-height:1.7;color:#6e6e6a">${esc(it.zh)}</div>`;
      if(w.note) h += `<div class="scene-tip" style="margin-top:10px">${esc(w.note)}</div>`;
      pbox.innerHTML = h;
    }
    const n = dailyData.news || DB.fallbackNews;
    const items = n.items || [];
    box.innerHTML = (n.date ? `<div class="tiny" style="margin-bottom:8px">📅 ${esc(n.date)} 推送</div>` : "")
      + items.map((it,i)=>`<div class="news-i">
        <div class="news-n">${i+1}</div>
        <div class="news-b"><h5>${esc(it.t)}</h5><p>${esc(it.d||"")}</p></div>
      </div>`).join("")
      + (n.note ? `<div class="scene-tip" style="margin-top:10px">${esc(n.note)}</div>` : "");

  }


  /* ---------- 事件 ---------- */
  UI.on("addTodo", ()=>{
    const i = document.getElementById("todoInp");
    if(!i.value.trim()) return UI.toast("先写点什么吧");
    S.addTodo(i.value); i.value=""; App.refresh();
  });
  UI.on("quickTodo", el=>{ S.addTodo(el.dataset.t); App.refresh(); });
  UI.on("toggleTodo", el=>{ S.toggleTodo(el.dataset.id); App.refresh(); });
  UI.on("delTodo", el=>{ S.delTodo(el.dataset.id); App.refresh(); });
  UI.on("mood", el=>{
    const t=S.today(); S.d.review[t]=S.d.review[t]||{};
    S.d.review[t].mood = Number(el.dataset.i); S.save();
    document.querySelectorAll(".mood").forEach((m,i)=>m.classList.toggle("on", i===Number(el.dataset.i)));
  });
  UI.on("star", el=>{
    const t=S.today(); S.d.review[t]=S.d.review[t]||{};
    S.d.review[t].score = Number(el.dataset.i); S.save();
    document.querySelectorAll("#stars .star").forEach((s,i)=>s.classList.toggle("on", i < Number(el.dataset.i)));
  });
  UI.on("saveReview", ()=>{
    const t = S.today();
    const r = S.d.review[t] = S.d.review[t] || {};
    r.good = document.getElementById("rvGood").value;
    r.bad  = document.getElementById("rvBad").value;
    r.next = document.getElementById("rvNext").value;
    const first = !r.saved;
    r.saved = true; S.save();
    if(first) S.addCoin(20,"完成复盘");
    if(first && r.next) S.addTodo("【昨日待办】"+r.next, "high");   // 仅首次写入，避免重复生成待办
    App.refresh();
    // 复盘结束 → 生成今日小结（点评 / 鼓励）
    const list = S.todos(t);
    const ctx = { total: list.length, doneN: list.filter(x=>x.done).length, streak: S.d.streak };
    const note = buildReviewNote(r, ctx);
    UI.sheet("今日小结 · 复盘完成", `
      <div class="rev-stat">
        <div><b>${"★".repeat(r.score||0)||"—"}</b><span>今日评分</span></div>
        <div><b>${MOODS[r.mood]||"·"}</b><span>${MOOD_TXT[r.mood]||"—"}</span></div>
        <div><b>${ctx.total?Math.round(ctx.doneN/ctx.total*100)+"%":"—"}</b><span>待办完成</span></div>
      </div>
      <div class="rev-note">${esc(note)}</div>
    `);
  });
  UI.on("refreshNews", async ()=>{ dailyData = null; UI.toast("正在获取…"); await afterRender(); UI.toast("已更新"); });
  UI.on("quest", el=>{
    const t=S.today(); const arr = S.d.questDone[t] = S.d.questDone[t]||[];
    const name = el.dataset.q;
    if(arr.includes(name)) return UI.toast("今天已经完成啦");
    arr.push(name); S.save(); S.addCoin(Number(el.dataset.p), name); App.refresh();
  });


  /* ---------- 复盘归档 / 回顾 ---------- */
  UI.on("openAllReviews", ()=>{
    const keys = savedReviews().sort().reverse();
    if(!keys.length) return UI.toast("还没有复盘记录");
    UI.sheet("复盘归档（"+keys.length+" 天）", keys.map(k=>{
      const r = S.d.review[k];
      const dt = new Date(k+"T00:00:00");
      const wd = WEEK[dt.getDay()];
      return `<div class="rv-row" data-act="rvDetail" data-k="${k}">
        <div class="rv-em">${MOODS[r.mood]||"·"}</div>
        <div class="rv-mid"><b>${k.slice(5)} ${wd}</b><span>${"★".repeat(r.score||0)||"未评分"}</span></div>
        <div class="rv-go">›</div>
      </div>`;
    }).join(""));
  });
  UI.on("rvDetail", el=>{
    const k = el.dataset.k; const r = S.d.review[k]; if(!r) return;
    const row = (h,p)=> p ? `<div class="rv-q"><h4>${h}</h4><p class="rv-p">${esc(p)}</p></div>` : "";
    UI.sheet(k+" 的复盘", `
      <div style="display:flex;align-items:center;gap:11px;margin-bottom:6px">
        <div style="font-size:30px">${MOODS[r.mood]||"·"}</div>
        <div><div style="font-weight:700;font-size:15px">${"★".repeat(r.score||0)||"未评分"}</div>
        <div class="tiny" style="color:var(--ink-3)">心情 · ${MOOD_TXT[r.mood]||"—"}</div></div>
      </div>
      ${row("✅ 做成了什么", r.good)}
      ${row("🌀 可以更好", r.bad)}
      ${row("🎯 明天最重要", r.next)}
    `);
  });
  UI.on("weekReview", ()=>{
    const rs = pastDays(7).map(k=>S.d.review[k]).filter(r=>r&&r.saved);
    if(!rs.length) return UI.toast("这周还没有复盘记录～");
    UI.sheet("本周回看（"+rs.length+" 天）", reviewRecapBody(rs));
  });
  UI.on("monthReview", ()=>{
    const p = S.today().slice(0,7);
    const rs = savedReviews().filter(k=>k.startsWith(p)).sort().map(k=>S.d.review[k]);
    if(!rs.length) return UI.toast("这个月还没开始复盘呢～");
    const ms = Number(p.slice(5));
    UI.sheet((ms)+" 月小总结（"+rs.length+" 天）", reviewRecapBody(rs));
  });

  return { render, afterRender };
})();

</script>
<script>
/* ============ 理财页 ============ */
window.ViewMoney = (function () {
  const { esc } = UI;
  let tab = "ledger";
  let billType = "out", billCat = "food";

  function render(){
    return `
    <div class="page-hero">
      <div class="date">FINANCE</div>
      <h2>理财学习</h2>
      <p>记录 → 看懂 → 改变。先把钱的流向看清楚，再谈投资。</p>
    </div>
    <div class="chips">

  /* ---------- 记账 ---------- */
  function ledger(){
    const m = S.monthBills();
    const out = S.sum(m,"out"), inc = S.sum(m,"in");
    const budget = S.d.budget || 3000;
    const sv = S.sv();
    const sPct = sv.goal>0 ? Math.min(100, Math.round(sv.balance/sv.goal*100)) : 0;
    const sDays = S.daysToSalary();
    const bpct = Math.min(100, out/budget*100);
    const todayBills = S.d.bills.filter(b=>b.date===S.today());
    const recent = S.d.bills.slice().sort((a,b)=>b.date<a.date?-1:1).reverse().slice(0,12);

    // 分类占比
    const byCat = {};
    m.filter(b=>b.type==="out").forEach(b=>{ byCat[b.cat]=(byCat[b.cat]||0)+Number(b.amt); });

    // 近 7 天柱状
    const days = [];
    for(let i=6;i>=0;i--){
      const dt = new Date(); dt.setDate(dt.getDate()-i);
      const k = S.ymd(dt);
      days.push({ k, lbl:(dt.getMonth()+1)+"/"+dt.getDate(),
        v: S.d.bills.filter(b=>b.date===k && b.type==="out").reduce((s,b)=>s+Number(b.amt),0) });
    }
    const mx = Math.max(1, ...days.map(d=>d.v));

    return `
    <div class="card money-hero" style="background:linear-gradient(135deg,#DFE5E9 0%,#EDE6E2 100%);border:1px solid rgba(255,255,255,.6)">
      <div style="display:flex;justify-content:space-between;align-items:flex-end">
        <div>
          <div class="tiny" style="color:#77706A;font-weight:600;letter-spacing:1px">本月支出</div>
          <div class="amt out">¥${out.toFixed(2)}</div>
        </div>
        <div style="text-align:right">
          <div class="tiny" style="color:#77706A;font-weight:600">本月收入</div>
          <div style="font-size:17px;font-weight:650;color:var(--down)">¥${inc.toFixed(2)}</div>
        </div>
      </div>
      <div style="margin-top:14px">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:#77706A;font-weight:600;margin-bottom:5px">
          <span>预算 ¥${budget}</span><span>${bpct>=100?"已超支":"剩余 ¥"+(budget-out).toFixed(0)}</span>
        </div>
        <div class="bar"><i style="width:${bpct}%;background:${bpct>85?"var(--up)":"var(--sage)"}"></i></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:13px">
        <button class="btn sm ghost" data-act="setBudget">改预算</button>
        <button class="btn sm ghost" data-act="monthReport">月度报告</button>
      </div>
    </div>

    <div class="card savings-hero" style="background:linear-gradient(135deg,#E6EDE8 0%,#EDE9F0 100%);border:1px solid rgba(255,255,255,.6)">
      <div style="display:flex;justify-content:space-between;align-items:flex-end">
        <div>
          <div class="tiny" style="color:#6f8a78;font-weight:600;letter-spacing:1px">💰 存款储蓄</div>
          <div style="font-size:30px;font-weight:680;color:#4f7d63;margin-top:2px">¥${sv.balance.toFixed(2)}</div>
        </div>
        <div style="text-align:right">
          <div class="tiny" style="color:#77706A;font-weight:600">储蓄目标</div>
          <div style="font-size:16px;font-weight:650;color:#8a7a5e">${sv.goal?("¥"+sv.goal.toFixed(0)):"未设"}</div>
        </div>
      </div>
      ${sv.goal?`<div style="margin-top:12px">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:#77706A;font-weight:600;margin-bottom:5px">
          <span>目标进度</span><span>${sPct}%</span></div>
        <div class="bar"><i style="width:${sPct}%;background:var(--sage)"></i></div></div>`:""}
      <div class="tiny" style="margin-top:11px;color:#6b6358;line-height:1.7">
        📅 发工资日：每月 <b style="color:#8a6d3b">${sv.salaryDay}</b> 号左右 ·
        <b style="color:#4f7d63">距下次还有 ${sDays} 天</b>
      </div>
      <div style="display:flex;gap:7px;margin-top:12px;flex-wrap:wrap">
        <button class="btn sm ghost" data-act="depIn">存入</button>
        <button class="btn sm ghost" data-act="depOut">取出</button>
        <button class="btn sm ghost" data-act="salaryGot">记工资到账</button>
      </div>
      <div style="display:flex;gap:7px;margin-top:8px">
        <button class="btn sm ghost" data-act="setSalary">改工资日</button>
        <button class="btn sm ghost" data-act="setGoal">设目标</button>
      </div>
    </div>

    ${sv.log && sv.log.length ? `<div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--sage)"></span>储蓄明细</h2>
        <span class="more">共 ${sv.log.length} 笔</span></div>
      ${sv.log.slice(0,8).map(r=>`<div class="bill">
        <div class="bill-e">${r.dir==="out"?"🏧":"🐖"}</div>
        <div class="bill-b"><h5>${esc(r.note||(r.dir==="out"?"取出":"存入"))}</h5><p>${r.date.slice(5)} · ${r.dir==="out"?"取出":"存入"}</p></div>
        <div class="bill-a" style="color:${r.dir==="out"?"var(--up)":"var(--down)"}">${r.dir==="out"?"−":"+"}${Number(r.amt).toFixed(2)}</div>
      </div>`).join("")}
    </div>` : ""}

    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--sand)"></span>快速记一笔</h2>
        <span class="more">今天 ${todayBills.length} 笔</span></div>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button class="chip ${billType==="out"?"on":""}" data-act="bType" data-v="out" style="flex:1;text-align:center">支出</button>
        <button class="chip ${billType==="in"?"on":""}" data-act="bType" data-v="in" style="flex:1;text-align:center">收入</button>
      </div>
      <div class="cat-pick">
        ${(billType==="out"?DB.cats:DB.incomeCats).map(c=>
          `<button class="cat-i ${billCat===c.k?"on":""}" data-act="bCat" data-v="${c.k}">
            <span class="e">${c.e}</span><span class="l">${c.l}</span></button>`).join("")}
      </div>
      <div style="display:flex;gap:8px">
        <input class="inp" id="bAmt" type="number" inputmode="decimal" placeholder="金额" style="flex:0 0 108px" />
        <input class="inp" id="bNote" placeholder="备注（可不填）" style="flex:1" />
      </div>
      <button class="btn block" data-act="addBill" style="margin-top:10px">记下这一笔 · +5 积分</button>
    </div>

    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--sage)"></span>近 7 天支出</h2></div>
      <div class="barchart">
        ${days.map(d=>`<div class="b" title="¥${d.v}"><i style="height:${d.v/mx*100}%"></i></div>`).join("")}
      </div>
      <div class="bar-lbl">${days.map(d=>`<span>${d.lbl}</span>`).join("")}</div>
      ${catList.length ? `<div style="margin-top:14px">
        <div class="tiny" style="font-weight:700;margin-bottom:8px">本月支出结构</div>
        ${catList.map(([k,v])=>{
          const c = DB.cats.find(x=>x.k===k) || {e:"✨",l:k};
          return `<div style="margin-bottom:9px">
            <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
              <span>${c.e} ${c.l}</span><b>¥${v.toFixed(0)} · ${(v/out*100).toFixed(0)}%</b></div>
            <div class="bar"><i style="width:${v/out*100}%;background:var(--clay)"></i></div></div>`;
        }).join("")}</div>` : ""}
    </div>

    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--mist)"></span>最近账单</h2></div>
      ${recent.length ? recent.map(b=>{
        const c = [...DB.cats,...DB.incomeCats].find(x=>x.k===b.cat) || {e:"✨",l:"其他"};
        return `<div class="bill">
          <div class="bill-e">${c.e}</div>
          <div class="bill-b"><h5>${esc(b.note||c.l)}</h5><p>${b.date.slice(5)} · ${c.l}</p></div>
          <div class="bill-a" style="color:${b.type==="out"?"var(--up)":"var(--down)"}">${b.type==="out"?"−":"+"}${Number(b.amt).toFixed(2)}</div>
          <button class="todo-x" data-act="delBill" data-id="${b.id}">✕</button>
        </div>`;
      }).join("") : `<div class="empty"><span class="em">🪙</span>还没有记录，从今天的第一笔开始</div>`}
    </div>`;
  }

  /* ---------- 金融知识 ---------- */
  function know(){
    const k = S.pick(DB.finance, 2);
    const more = S.pickMany(DB.finance, 4, 9).filter(x=>x.t!==k.t).slice(0,3);
    const read = !!S.d.finRead[S.today()];
    return `
    <div class="card" style="background:linear-gradient(135deg,#EDEAF1,#F1EDE6);border:1px solid var(--line-2)">
      <div class="tiny" style="letter-spacing:1.6px;font-weight:700;color:var(--lilac)">今日金融知识 · ${esc(k.k)}</div>
      <h3 style="margin:9px 0 8px;font-size:19px;font-weight:670">${esc(k.t)}</h3>
      <p style="margin:0;font-size:13.5px;line-height:1.85;color:var(--ink-2)">${esc(k.d)}</p>
      <button class="btn block ${read?"soft":""}" data-act="readFin" style="margin-top:14px">${read?"今天已学习 ✓":"我学会了 · +10 积分"}</button>

    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--sand)"></span>再读三条</h2>

        <div class="lesson-n" style="background:var(--sand-s);color:#8C7550">${esc(x.k.slice(0,1))}</div>
        <div class="lesson-b"><h5>${esc(x.t)}</h5><p>${esc(x.d)}</p></div></div>`).join("")}

    </div>

    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--sage)"></span>今日理财三问</h2></div>
      <div class="kv"><span>今天有没有冲动消费？</span><b>${S.d.bills.filter(b=>b.date===S.today()&&b.type==="out").length} 笔支出</b></div>
      <div class="kv"><span>本月结余率</span><b>${(()=>{const m=S.monthBills(),i=S.sum(m,"in"),o=S.sum(m,"out");return i>0?((i-o)/i*100).toFixed(0)+"%":"待记录";})()}</b></div>
      <div class="kv"><span>应急金进度（目标 3 个月开支）</span><b>${(()=>{const m=S.monthBills();const o=S.sum(m,"out")||1;return "¥"+(o*3).toFixed(0)+" 目标";})()}</b></div>
    </div>`;
  }

  /* ---------- 股市学习 ---------- */
  function stockCard(title, color, item, read, act){
