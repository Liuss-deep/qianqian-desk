    <div class="card" style="border:1px solid var(--line-2)">
      <div class="tiny" style="letter-spacing:1.2px;font-weight:700;color:${color}">${title}</div>
      <h3 style="margin:9px 0 8px;font-size:18px;font-weight:670">${esc(item.t)}</h3>
      <p style="margin:0;font-size:13.5px;line-height:1.85;color:var(--ink-2)">${esc(item.d)}</p>
      ${act?`<button class="btn block ${read?"soft":""}" data-act="${act}" style="margin-top:14px">${read?"今天已学习 ✓":"我学会了 · +10 积分"}</button>`:""}
    </div>`;
  }
  function stockList(title, arr, items, allKey){
    return `
    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--sand)"></span>${title}</h2>
        <span class="more">共 ${arr.length} 条</span></div>
      ${items.map(x=>`<div class="lesson">
        <div class="lesson-n" style="background:var(--sand-s);color:#8C7550">📌</div>
        <div class="lesson-b"><h5>${esc(x.t)}</h5><p>${esc(x.d)}</p></div></div>`).join("")}
      <button class="btn ghost block" data-act="${allKey}" style="margin-top:12px">查看全部</button>
    </div>`;
  }
  function stock(){
    const basics = S.pick(DB.stockBasics, 1);

    return `
    <div class="card" style="background:linear-gradient(135deg,#EDEAF1,#F1EDE6);border:1px solid var(--line-2)">

    ${stockCard("📊 股市变化 · 今日规律", "var(--sand)", moves, null, null)}
    ${stockList("延伸：更多市场规律", DB.stockMoves, movesMore, "allMoves")}

    ${stockCard("📰 股市新闻 · 怎么读", "var(--sage)", news, null, null)}
    ${stockList("延伸：更多读新闻的方法", DB.stockNews, newsMore, "allNews")}

    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--clay)"></span>靠谱信息源</h2></div>
      <p class="tiny" style="line-height:1.8;margin-bottom:10px">新手只看权威源，少刷小作文。点开即可查看实时行情与资讯。</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        ${DB.stockSources.map(s=>`<a class="lk" href="${s.u}" target="_blank" rel="noopener">${s.e} ${s.n}</a>`).join("")}
      </div>

  /* ---------- 理财课程 ---------- */
  function path(){
    const done = S.d.finDone;
    const pct = Math.round(done.length/DB.finPath.length*100);
    return `
    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--lilac)"></span>12 周理财入门路径</h2>
        <span class="more">${done.length}/${DB.finPath.length}</span></div>
      <div class="bar" style="margin-bottom:14px"><i style="width:${pct}%;background:var(--lilac)"></i></div>
      ${DB.finPath.map((x,i)=>{
        const d = done.includes(i);
        return `<div class="lesson ${d?"done":""}">
          <div class="lesson-n">${d?"✓":"W"+(i+1)}</div>
          <div class="lesson-b"><h5>${esc(x.t)}</h5><p>${esc(x.d)}</p></div>

    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--clay)"></span>理财书单</h2></div>
      ${DB.books.filter(b=>/理财|财富|投资|商业|财商/.test(b.tag)).map(b=>`
        <div class="book">
          <div class="book-c" style="background:${b.c}">${esc(b.t.slice(0,6))}</div>
          <div class="book-b">
            <h5>${esc(b.t)}</h5><div class="au">${esc(b.a)} · ${esc(b.tag)}</div>
            <div class="de">${esc(b.d)}</div>

              <a class="lk" href="${UI.weread(b.t)}" target="_blank" rel="noopener">微信读书</a>

  UI.on("mTab", el=>{ tab = el.dataset.t; App.refresh(); });
  UI.on("bType", el=>{ billType = el.dataset.v; billCat = billType==="out"?"food":"salary"; App.refresh(); });
  UI.on("bCat", el=>{ billCat = el.dataset.v; App.refresh(); });

    const a = document.getElementById("bAmt").value;
    if(!a || Number(a)<=0) return UI.toast("请输入金额");

        <h4 style="margin:5px 0 5px;font-size:14.5px">${esc(x.t)}</h4>

    const m = S.monthBills(), out=S.sum(m,"out"), inc=S.sum(m,"in");

  });

        <input class="inp" id="depAmt" type="number" inputmode="decimal" placeholder="例如 500" /></div>
      <div class="fld"><label>备注（可选）</label>
        <input class="inp" id="depNote" placeholder="例如 工资结余" /></div>
      <button class="btn block" data-act="doDep" data-dir="in">确认存入 · +3 积分</button>`);
  });
  UI.on("depOut", ()=>{
    UI.sheet("取出存款", `
      <div class="fld"><label>取出金额（元）</label>
        <input class="inp" id="depAmt" type="number" inputmode="decimal" placeholder="例如 200" /></div>
      <div class="fld"><label>用途（可选）</label>
        <input class="inp" id="depNote" placeholder="例如 买大件" /></div>
      <button class="btn block" data-act="doDep" data-dir="out">确认取出</button>`);
  });
  UI.on("doDep", el=>{
    const amt = document.getElementById("depAmt").value;
    if(!amt || Number(amt)<=0) return UI.toast("请输入金额");
    if(!S.addSaving(amt, document.getElementById("depNote").value, el.dataset.dir)) return UI.toast("金额无效");
    S.addCoin(3,"存款"); UI.closeSheet(); App.refresh();
  });
  UI.on("salaryGot", ()=>{
    UI.sheet("记一笔工资到账", `
      <p class="tiny" style="line-height:1.8;margin-bottom:12px">这笔会同时记为「工资收入」并存入你的存款储蓄。</p>
      <div class="fld"><label>工资金额（元）</label>
        <input class="inp" id="salAmt" type="number" inputmode="decimal" placeholder="例如 8000" /></div>
      <button class="btn block" data-act="doSalary">记到账 · 工资+存款</button>`);
  });
  UI.on("doSalary", ()=>{
    const a = document.getElementById("salAmt").value;
    if(!a || Number(a)<=0) return UI.toast("请输入金额");
    S.d.bills.push({ id:Date.now()+"", date:S.today(), type:"in", cat:"salary", amt:Number(a), note:"工资到账" });
    S.addSaving(a, "工资到账", "in");
    S.save(); S.addCoin(5,"记账"); UI.closeSheet(); App.refresh();
  });
  UI.on("setSalary", ()=>{
    UI.sheet("设置发工资日", `
      <div class="fld"><label>每月几号发工资（1–28）</label>
        <input class="inp" id="salDay" type="number" value="${S.sv().salaryDay}" /></div>
      <p class="tiny" style="line-height:1.8;margin-bottom:12px">App 会显示「距下次发工资还有几天」。</p>
      <button class="btn block" data-act="saveSalary">保存</button>`);
  });
  UI.on("saveSalary", ()=>{
    const v = Number(document.getElementById("salDay").value);
    if(v>=1 && v<=28){ S.setSalaryDay(v); UI.closeSheet(); App.refresh(); UI.toast("已更新发工资日"); }
    else UI.toast("请输入 1–28");
  });
  UI.on("setGoal", ()=>{
    UI.sheet("设置储蓄目标", `
      <div class="fld"><label>目标存款（元）</label>
        <input class="inp" id="goalInp" type="number" value="${S.sv().goal}" /></div>
      <p class="tiny" style="line-height:1.8;margin-bottom:12px">比如先定一个小目标：3 万元应急金。</p>
      <button class="btn block" data-act="saveGoal">保存</button>`);
  });
  UI.on("saveGoal", ()=>{
    const v = Number(document.getElementById("goalInp").value);
    if(v>=0){ S.setGoal(v); UI.closeSheet(); App.refresh(); UI.toast("目标已更新"); }
  });

  /* ---------- 股市学习 ---------- */
  UI.on("readStock", ()=>{
    if(S.d.stockRead[S.today()]) return UI.toast("今天已经学过啦");
    S.d.stockRead[S.today()] = true; S.save(); S.addCoin(10,"股市知识"); App.refresh();
  });
  UI.on("allBasics", ()=> UI.sheet("全部股市基础知识（"+DB.stockBasics.length+"）",
    DB.stockBasics.map(x=>`<div class="card tight" style="margin-bottom:10px">
      <h4 style="margin:5px 0 5px;font-size:14.5px">${esc(x.t)}</h4>
      <p style="margin:0;font-size:12.5px;line-height:1.75;color:var(--ink-2)">${esc(x.d)}</p></div>`).join("")));
  UI.on("allMoves", ()=> UI.sheet("全部股市变化规律（"+DB.stockMoves.length+"）",
    DB.stockMoves.map(x=>`<div class="card tight" style="margin-bottom:10px">
      <h4 style="margin:5px 0 5px;font-size:14.5px">${esc(x.t)}</h4>
      <p style="margin:0;font-size:12.5px;line-height:1.75;color:var(--ink-2)">${esc(x.d)}</p></div>`).join("")));
  UI.on("allNews", ()=> UI.sheet("全部股市新闻读法（"+DB.stockNews.length+"）",
    DB.stockNews.map(x=>`<div class="card tight" style="margin-bottom:10px">
      <h4 style="margin:5px 0 5px;font-size:14.5px">${esc(x.t)}</h4>
      <p style="margin:0;font-size:12.5px;line-height:1.75;color:var(--ink-2)">${esc(x.d)}</p></div>`).join("")));

  return { render, afterRender(){} };
})();

</script>
<script>
/* ============ 学习页：阅读 + 雅思 ============ */
window.ViewLearn = (function () {
  const { esc } = UI;
  let tab = "read";
  let wordIdx = 0, flipped = false, showAns = false;
  let podFetchedOnce = false;

  function render(){
    return `
    <div class="page-hero">
      <div class="date">LEARNING</div>
      <h2>每日阅读 & 雅思</h2>
      <p>输入决定输出。每天读一点、背一点、听一点，考试和内容都会有回报。</p>
    </div>
    <div class="chips">
      ${[["read","📚 每日阅读"],["scene","💬 情景练习"],["word","🔤 单词记忆"],["listen","🎬 影视精听"],["podcast","🎧 播客"]].map(c=>
        `<button class="chip ${tab===c[0]?"on":""}" data-act="lTab" data-t="${c[0]}">${c[1]}</button>`).join("")}
    </div>
    ${tab==="read"?read():tab==="scene"?scene():tab==="word"?word():tab==="listen"?listen():podcast()}`;
  }

  /* ---------- 每日阅读 ---------- */
  function read(){
    const today = S.pick(DB.books, 3);
    const rec = S.pickMany(DB.books, 6, 11).filter(b=>b.t!==today.t).slice(0,5);
    const log = S.d.bookLog[S.today()];
    const total = Object.keys(S.d.bookLog).length;
    const pages = Object.values(S.d.bookLog).reduce((s,x)=>s+Number(x.pages||0),0);

    return `
    <div class="card" style="background:linear-gradient(135deg,#E9EEE9,#F2ECE5);border:1px solid var(--line-2)">
      <div class="tiny" style="letter-spacing:1.6px;font-weight:700;color:var(--sage)">今日推荐 · ${esc(today.tag)}</div>
      <div style="display:flex;gap:14px;margin-top:11px">
        <div class="book-c" style="background:${today.c};width:62px;height:84px;font-size:11px">${esc(today.t.slice(0,7))}</div>
        <div style="flex:1;min-width:0">
          <h3 style="margin:0;font-size:17px;font-weight:670">${esc(today.t)}</h3>
          <div class="au" style="font-size:11.5px;color:var(--ink-3);margin:4px 0 7px">${esc(today.a)} · 约 ${today.min} 分钟/章</div>
          <p style="margin:0;font-size:12.5px;line-height:1.75;color:var(--ink-2)">${esc(today.d)}</p>
        </div>
      </div>
      <div class="book-links" style="margin-top:12px">
        <a class="lk" href="${UI.weread(today.t)}" target="_blank" rel="noopener">📖 微信读书</a>
        <a class="lk" href="${UI.douban(today.t)}" target="_blank" rel="noopener">🔖 豆瓣</a>
        <a class="lk" href="${UI.jd(today.t)}" target="_blank" rel="noopener">🛒 购买</a>
        <button class="lk" data-act="wantRead" data-t="${esc(today.t)}">＋ 想读</button>
      </div>
    </div>

    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--clay)"></span>今日读书打卡</h2>
        <span class="more">累计 ${total} 天 · ${pages} 页</span></div>
      ${log ? `<div class="scene-tip" style="background:var(--sage-s);color:#5F7563">
          今天已打卡：《${esc(log.title)}》${log.pages} 页<br>${esc(log.note||"")}</div>`
        : `<div class="fld"><label>书名</label><input class="inp" id="bkT" placeholder="正在读的书" value="${esc(today.t)}" /></div>
          <div class="fld"><label>读了多少页</label><input class="inp" id="bkP" type="number" placeholder="例如 25" /></div>
          <div class="fld"><label>一句话摘录 / 感想</label><textarea class="inp" id="bkN" placeholder="打动你的一句话就够了"></textarea></div>
          <button class="btn block" data-act="logBook">完成打卡 · +15 积分</button>`}
    </div>

    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--mist)"></span>本期热销 & 高分书单</h2>
        <span class="more" data-act="allBooks">全部 ${DB.books.length} 本 ›</span></div>
      ${rec.map(b=>bookRow(b)).join("")}
    </div>

    ${S.d.bookShelf.length ? `<div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--sand)"></span>我的想读清单</h2></div>
      ${S.d.bookShelf.map(t=>`<div class="kv"><span>${esc(t)}</span>
        <span><a class="lk" href="${UI.weread(t)}" target="_blank" rel="noopener">去读</a>
        <button class="todo-x" data-act="delShelf" data-t="${esc(t)}">✕</button></span></div>`).join("")}
    </div>` : ""}`;
  }

  function bookRow(b){
    return `<div class="book">
      <div class="book-c" style="background:${b.c}">${esc(b.t.slice(0,6))}</div>
      <div class="book-b">
        <h5>${esc(b.t)}</h5>
        <div class="au">${esc(b.a)} · ${esc(b.tag)}</div>
        <div class="de">${esc(b.d)}</div>
        <div class="book-links">
          <a class="lk" href="${UI.weread(b.t)}" target="_blank" rel="noopener">微信读书</a>
          <a class="lk" href="${UI.douban(b.t)}" target="_blank" rel="noopener">豆瓣</a>
          <button class="lk" data-act="wantRead" data-t="${esc(b.t)}">＋ 想读</button>
        </div>
      </div></div>`;
  }

  /* ---------- 情景练习 ---------- */
  function scene(){
    const idx = S.pickIdx(DB.ieltsScenes.length, 4);
    const sc = DB.ieltsScenes[idx];
    const done = (S.d.sceneDone[S.today()]||[]).includes(idx);
    return `
    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--mist)"></span>今日场景</h2>
        <span class="more" data-act="allScene">切换场景 ›</span></div>
      <div class="movie-hd" style="background:linear-gradient(135deg,#E4EBF0,#EFEAE4)">
        <h4>${esc(sc.s)}</h4>
        <p>跟读 3 遍 → 遮住中文复述 → 录音对比</p>
      </div>
      ${sc.lines.map(l=>`<div class="dlg">
        <div class="who">${esc(l.w)}</div>
        <div class="en">${esc(l.en)}</div>
        <div class="cn">${esc(l.cn)}</div></div>`).join("")}
      <div class="scene-tip">💡 ${esc(sc.tip)}</div>
      <div style="margin-top:12px">
        <div class="tiny" style="font-weight:700;margin-bottom:7px">本场景高分表达</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${sc.words.map(w=>`<span class="pill" style="background:var(--mist-s);color:#5B6C78">${esc(w)}</span>`).join("")}
        </div>
      </div>
      <button class="btn block ${done?"soft":""}" data-act="doneScene" data-i="${idx}" style="margin-top:14px">
        ${done?"今日已练习 ✓":"完成练习 · +20 积分"}</button>
    </div>

    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--lilac)"></span>全部场景库</h2></div>
      ${DB.ieltsScenes.map((x,i)=>`<div class="kv">
        <span>${esc(x.s)}</span>
        <button class="lk" data-act="openScene" data-i="${i}">查看</button></div>`).join("")}
    </div>`;
  }

  /* ---------- 单词记忆 ---------- */
  function word(){
    const list = S.pickMany(DB.ieltsWords, 10, 6);
    if(wordIdx >= list.length) wordIdx = 0;
    const w = list[wordIdx];
    const box = S.d.wordBox[w.w] || { lvl:0 };
    const learned = Object.values(S.d.wordBox).filter(x=>x.lvl>=2).length;

    return `
    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--sage)"></span>今日词卡</h2>
        <span class="more">${wordIdx+1} / ${list.length} · 已掌握 ${learned}</span></div>
      <div class="bar" style="margin-bottom:14px"><i style="width:${(wordIdx)/list.length*100}%"></i></div>
      <div class="flash" data-act="flip">
        ${!flipped ? `<div class="w">${esc(w.w)}</div><div class="ph">${esc(w.p)}</div>
            <div class="hint">轻点卡片查看释义</div>`
          : `<div class="w" style="font-size:23px">${esc(w.w)}</div>
             <div class="mean">${esc(w.m)}</div>
             <div class="ex">${esc(w.e)}</div>
             <div class="ph">${esc(w.ec)}</div>`}
      </div>
      <div class="grid3" style="margin-top:13px">
        <button class="btn ghost sm" data-act="wRate" data-v="0">不认识</button>
        <button class="btn soft sm" data-act="wRate" data-v="1">模糊</button>
        <button class="btn sm" data-act="wRate" data-v="2">认识</button>
      </div>
      <div class="tiny" style="text-align:center;margin-top:10px">熟练度：${["未学","眼熟","掌握","牢记"][Math.min(box.lvl,3)]}</div>
    </div>

    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--sand)"></span>今日词表</h2>
        <span class="more">共 ${DB.ieltsWords.length} 词</span></div>
      ${list.map((x,i)=>{
        const b = S.d.wordBox[x.w]||{lvl:0};
        const c = ["#C4BDB4","#C9A06A","#8FA98E","#7F9E86"][Math.min(b.lvl,3)];
        return `<div class="kv" style="${i===wordIdx?"background:var(--card-2);border-radius:9px;padding:9px 8px":""}">
          <span><b>${esc(x.w)}</b> <span class="tiny">${esc(x.m)}</span></span>
          <span class="pill" style="background:${c}22;color:${c}">${["新","眼熟","掌握","牢记"][Math.min(b.lvl,3)]}</span></div>`;
      }).join("")}
    </div>`;
  }

  /* ---------- 影视精听 ---------- */
  function listen(){
    const idx = S.pickIdx(DB.listening.length, 8);
    const l = DB.listening[idx];
    const done = S.d.listenDone.includes(idx);
    let txt = esc(l.text);
    if(showAns){
      let k = 0;
      txt = txt.replace(/___/g, () => `<span class="blank">${esc(l.ans[k++]||"")}</span>`);
    } else {
      txt = txt.replace(/___/g, '<span class="blank">&nbsp;&nbsp;&nbsp;</span>');
    }
    return `
    <div class="card">
      <div class="movie-hd">
        <h4>🎬 ${esc(l.film)}</h4>
        <p>${esc(l.scene)} · 难度 ${esc(l.lvl)}</p>
      </div>
      <div class="tiny" style="font-weight:700;margin-bottom:8px">听写填空</div>
      <div style="font-size:15px;line-height:2.1;padding:14px;background:var(--card-2);border-radius:14px">${txt}</div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn ghost" data-act="toggleAns" style="flex:1">${showAns?"隐藏答案":"显示答案"}</button>
        <button class="btn ${done?"soft":""}" data-act="doneListen" data-i="${idx}" style="flex:1">${done?"已完成 ✓":"完成 · +20"}</button>
      </div>
      ${showAns?`<div style="margin-top:12px;padding:13px;background:var(--sage-s);border-radius:13px;font-size:13px;line-height:1.8;color:#5F7563">
        <b>完整台词</b><br>${esc(l.full)}</div>`:""}
      <div class="scene-tip">💡 ${esc(l.note)}</div>
    </div>

    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--clay)"></span>精听方法（每次 15 分钟）</h2></div>
      ${[["1","盲听 2 遍","不看文本，抓大意，能听懂多少算多少"],
         ["2","逐句听写","一句一停，反复听到写不出为止"],
         ["3","对照原文","标记听错的地方，分析是连读、弱读还是生词"],
         ["4","跟读 3 遍","模仿语调和节奏，这一步决定口语提升"],
         ["5","复述","合上文本，用自己的话说一遍情节"]].map(x=>
        `<div class="lesson"><div class="lesson-n">${x[0]}</div>
        <div class="lesson-b"><h5>${x[1]}</h5><p>${x[2]}</p></div></div>`).join("")}
    </div>

    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--lilac)"></span>精听片段库</h2>
        <span class="more">${S.d.listenDone.length}/${DB.listening.length} 已完成</span></div>
      ${DB.listening.map((x,i)=>`<div class="kv">
        <span>${esc(x.film)} <span class="tiny">· ${esc(x.lvl)}</span></span>
        <span>${S.d.listenDone.includes(i)?'<span class="pill" style="background:var(--sage-s);color:var(--sage)">已练</span>':
          `<button class="lk" data-act="openListen" data-i="${i}">练习</button>`}</span></div>`).join("")}
    </div>`;
  }

  /* ---------- 播客 ---------- */
  function podcast(){
    const pc = S.d.podcastCache;
    const picks = (pc && pc.items && pc.items.length) ? pc.items : DB.fallbackPodcasts.items;
    const theme = (pc && pc.theme) || DB.fallbackPodcasts.theme;
    const date = pc && pc.date ? pc.date : "";
    const heard = S.d.podHeard || [];
    const want = S.d.podWant || [];
    const lib = S.pickMany(DB.podcasts, 6, 3);

    return `
    <div class="card" style="background:linear-gradient(135deg,#EFE7F0,#F2ECE5);border:1px solid var(--line-2)">
      <div class="tiny" style="letter-spacing:1.6px;font-weight:700;color:var(--lilac)">🎧 今日精选播客 · 09:00 推送</div>
      <div style="font-size:15px;font-weight:670;margin-top:8px">${esc(theme)}</div>
      ${date?`<div class="tiny" style="margin-top:4px">📅 ${esc(date)} 推送</div>`:""}
    </div>

    ${picks.map(p=>{
      const isHeard = heard.includes(p.t);
      return `<div class="card">
        <div style="display:flex;gap:10px;align-items:flex-start">
          <div style="width:44px;height:44px;border-radius:12px;background:var(--lilac-s);display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto">🎙️</div>
          <div style="flex:1;min-width:0">
            <h3 style="margin:0;font-size:15.5px;font-weight:670">${esc(p.t)}</h3>
            <div class="au" style="font-size:11px;color:var(--ink-3)">${esc(p.host||"")} · ${esc(p.where||"小宇宙")}</div>
            <span class="pill" style="background:var(--lilac-s);color:var(--lilac);margin-top:5px;display:inline-block">${esc(p.tag||"")}</span>
          </div>
        </div>
        <p style="margin:10px 0 0;font-size:12.5px;line-height:1.75;color:var(--ink-2)">${esc(p.d||"")}</p>
        ${p.why?`<div class="scene-tip" style="margin-top:9px;background:var(--lilac-s);color:#7A6B86">💡 为什么今天听它：${esc(p.why)}</div>`:""}
        <div style="display:flex;gap:8px;margin-top:11px">
          <button class="btn ${isHeard?"soft":""}" data-act="hearPod" data-t="${esc(p.t)}" style="flex:1">${isHeard?"已听完 ✓":"我听完了 · +10"}</button>
          <button class="lk" data-act="wantPod" data-t="${esc(p.t)}">${want.includes(p.t)?"✓ 已收藏":"＋ 想听"}</button>
        </div>
      </div>`;
    }).join("")}

    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--sage)"></span>节目库 · 随便翻翻</h2>
        <span class="more" data-act="allPods">全部 ${DB.podcasts.length} 档 ›</span></div>
      ${lib.map(podRow).join("")}
    </div>

    <div class="scene-tip">🎧 听播客的平台：小宇宙（中文最全）、苹果播客、喜马拉雅、Spotify、网易云音乐都支持订阅。通勤 / 运动 / 做家务时听，最不费精力。</div>

    ${want.length?`<div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--sand)"></span>我的想听清单</h2></div>
      ${want.map(t=>`<div class="kv"><span>${esc(t)}</span>
        <button class="todo-x" data-act="delWantPod" data-t="${esc(t)}">✕</button></div>`).join("")}
    </div>`:""}`;
  }

  function podRow(p){
    const want = S.d.podWant||[];
    return `<div class="kv">
      <div style="min-width:0;flex:1">
        <b>${esc(p.t)}</b> <span class="tiny">· ${esc(p.tag||"")}</span>
        <div class="au" style="font-size:11px">${esc(p.host||"")}</div>
      </div>
      <span><button class="lk" data-act="wantPod" data-t="${esc(p.t)}">${want.includes(p.t)?"已收藏":"＋ 想听"}</button></span>
    </div>`;
  }

  /* ---------- 事件 ---------- */
  UI.on("lTab", el=>{ tab = el.dataset.t; flipped=false; showAns=false; App.refresh(); });
  UI.on("wantRead", el=>{
    const t = el.dataset.t;
    if(S.d.bookShelf.includes(t)) return UI.toast("已在清单里");
    S.d.bookShelf.push(t); S.save(); UI.toast("已加入想读清单"); App.refresh();
  });
  UI.on("delShelf", el=>{ S.d.bookShelf = S.d.bookShelf.filter(x=>x!==el.dataset.t); S.save(); App.refresh(); });
  UI.on("logBook", ()=>{
    const t = document.getElementById("bkT").value.trim();
    const p = document.getElementById("bkP").value;
    if(!t) return UI.toast("填一下书名");
    S.d.bookLog[S.today()] = { title:t, pages:Number(p||0), note:document.getElementById("bkN").value.trim() };
    S.save(); S.addCoin(15,"读书打卡"); App.refresh();
  });
  UI.on("allBooks", ()=>{
    UI.sheet("全部书单（"+DB.books.length+" 本）", DB.books.map(bookRow).join(""));
  });
  UI.on("doneScene", el=>{
    const t=S.today(); const a = S.d.sceneDone[t] = S.d.sceneDone[t]||[];
    const i = Number(el.dataset.i);
    if(a.includes(i)) return UI.toast("今天已练习过");
    a.push(i); S.save(); S.addCoin(20,"情景练习"); App.refresh();
  });
  UI.on("openScene", el=>{
    const sc = DB.ieltsScenes[Number(el.dataset.i)];
    UI.sheet(sc.s, sc.lines.map(l=>`<div class="dlg"><div class="who">${esc(l.w)}</div>
      <div class="en">${esc(l.en)}</div><div class="cn">${esc(l.cn)}</div></div>`).join("")
      + `<div class="scene-tip">💡 ${esc(sc.tip)}</div>
         <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px">
         ${sc.words.map(w=>`<span class="pill" style="background:var(--mist-s);color:#5B6C78">${esc(w)}</span>`).join("")}</div>`);
  });
  UI.on("allScene", ()=>{ S.d.seedOffset++; S.save(); UI.toast("换一个场景"); App.refresh(); });
  UI.on("flip", ()=>{ flipped = !flipped; App.refresh(); });
  UI.on("wRate", el=>{
    const list = S.pickMany(DB.ieltsWords, 10, 6);
    const w = list[wordIdx];
    const v = Number(el.dataset.v);
    const box = S.d.wordBox[w.w] = S.d.wordBox[w.w] || { lvl:0 };
    box.lvl = v===0 ? 0 : Math.min(3, (box.lvl||0) + (v===2?2:1));
    box.last = S.today(); S.save();
    flipped = false;
    if(wordIdx < list.length-1){ wordIdx++; }
    else { wordIdx = 0; S.addCoin(25,"完成今日词卡"); UI.toast("🎉 今日 10 词全部过完！"); }
    App.refresh();
  });
  UI.on("toggleAns", ()=>{ showAns = !showAns; App.refresh(); });
  UI.on("doneListen", el=>{
    const i = Number(el.dataset.i);
    if(S.d.listenDone.includes(i)) return UI.toast("已完成过啦");
    S.d.listenDone.push(i); S.save(); S.addCoin(20,"影视精听"); App.refresh();
  });
  UI.on("openListen", el=>{
    const l = DB.listening[Number(el.dataset.i)];
    UI.sheet(l.film, `<div class="movie-hd"><h4>${esc(l.scene)}</h4><p>难度 ${esc(l.lvl)}</p></div>
      <div style="font-size:15px;line-height:2;padding:14px;background:var(--card-2);border-radius:14px">${esc(l.text).replace(/___/g,'<span class="blank">&nbsp;&nbsp;</span>')}</div>
      <div style="margin-top:12px;padding:13px;background:var(--sage-s);border-radius:13px;font-size:13px;line-height:1.8;color:#5F7563"><b>答案</b><br>${esc(l.full)}</div>
      <div class="scene-tip">💡 ${esc(l.note)}</div>`);
  });

  UI.on("hearPod", el=>{
    const t = el.dataset.t;
    if((S.d.podHeard||[]).includes(t)) return UI.toast("今天已经记过啦");
    S.d.podHeard = S.d.podHeard || [];
    S.d.podHeard.push(t); S.save(); S.addCoin(10,"听播客"); App.refresh();
  });
  UI.on("wantPod", el=>{
    const t = el.dataset.t;
    S.d.podWant = S.d.podWant || [];
    if(S.d.podWant.includes(t)){ S.d.podWant = S.d.podWant.filter(x=>x!==t); UI.toast("已取消收藏"); }
    else { S.d.podWant.push(t); S.save(); UI.toast("已加入想听清单"); }
    App.refresh();
  });
  UI.on("delWantPod", el=>{ S.d.podWant = (S.d.podWant||[]).filter(x=>x!==el.dataset.t); S.save(); App.refresh(); });
  UI.on("allPods", ()=>{
    UI.sheet("节目库（"+DB.podcasts.length+" 档）", DB.podcasts.map(p=>`
      <div class="kv"><div style="min-width:0;flex:1">
        <b>${esc(p.t)}</b> <span class="tiny">· ${esc(p.tag||"")}</span>
        <div class="au" style="font-size:11px">${esc(p.host||"")} · ${esc(p.where||"")}</div>
        <div class="de" style="font-size:11.5px;margin-top:2px">${esc(p.d||"")}</div>
      </div><span><button class="lk" data-act="wantPod" data-t="${esc(p.t)}">${(S.d.podWant||[]).includes(p.t)?"已收藏":"＋ 想听"}</button></span></div>`).join(""));
  });
  UI.on("refreshPod", async ()=>{ podFetchedOnce=false; UI.toast("获取中…"); await S.fetchDaily(); App.refresh(); });

  async function afterRender(){
    // 进入播客页时拉取当日 09:00 推送
    if(tab === "podcast"){
      if(!podFetchedOnce){
        podFetchedOnce = true;
        await S.fetchDaily();
        App.refresh();
      }
      return;
    }
    // 离开播客时重置标记，下次进入重新拉取
    podFetchedOnce = false;
  }

  return { render, afterRender };
})();

</script>
<script>
/* ============ 生活页：食谱 + 地球 Online ============ */
window.ViewLife = (function () {
  const { esc } = UI;
  let tab = "food";

  function render(){
    return `
    <div class="page-hero">
      <div class="date">DAILY LIFE</div>
      <h2>好好吃饭 · 认真生活</h2>
      <p>厨房是最容易获得成就感的地方，而生活本身就是一场长线游戏。</p>
    </div>
    <div class="chips">
      ${[["food","🍳 今日食谱"],["mine","📔 我的菜单"],["photo","📷 拍照打卡"],["game","🌏 地球 Online"]].map(c=>
        `<button class="chip ${tab===c[0]?"on":""}" data-act="fTab" data-t="${c[0]}">${c[1]}</button>`).join("")}
    </div>
    ${tab==="food"?food():tab==="mine"?mine():tab==="photo"?photo():game()}`;
  }

  /* ---------- 菜单数据结构助手（支持一天多道菜） ---------- */
  // menu[k] 可存 { items:[菜名,...] } 或旧格式 { name }；统一返回数组
  function menuItems(m){ return m ? (m.items || (m.name ? [m.name] : [])) : []; }

  function addMenuDish(k, name){
    const m = S.d.menu[k] || {};
    const arr = menuItems(m);
    if(arr.includes(name)){ UI.toast("已经在菜单里啦"); return -1; }
    const isNew = arr.length === 0;
    arr.push(name);
    S.d.menu[k] = { items: arr };
    S.save();
    return isNew ? 1 : 0; // 1=当天首道，0=追加
  }

  /* ---------- 今日食谱 ---------- */
  function food(){
    const r = S.pick(DB.recipes, 7);
    const more = S.pickMany(DB.recipes, 4, 13).filter(x=>x.n!==r.n).slice(0,3);
    const menu = S.d.menu[S.today()];
    const items = menuItems(menu);
    return `
    ${items.length ? `<div class="card" style="background:var(--sage-s);border-color:var(--sage)">
      <div class="tiny" style="font-weight:700;color:#5F7563">今天已定 ${items.length} 道：</div>
      ${items.map(x=>`<div class="menu-item"><span>${esc(x)}</span><em class="lk sm" data-act="rmMenuItem" data-k="${S.today()}" data-n="${esc(x)}">✕</em></div>`).join("")}
      <button class="btn ghost sm" data-act="clearMenu" style="margin-top:10px">清空今日菜单</button>
    </div>` : ""}

    <div class="recipe">
      <div class="recipe-top">
        <div class="tiny" style="font-weight:700;color:#8A7A66;letter-spacing:1.4px">今日推荐</div>
        <h4 style="margin-top:6px">${esc(r.n)}</h4>
        <div class="recipe-meta"><span>⏱ ${esc(r.t)}</span><span>🎯 ${esc(r.lv)}</span><span>🔥 ${esc(r.kcal)}</span></div>
      </div>
      <div class="recipe-body">
        <h6>食材</h6><p>${esc(r.ing)}</p>
        <h6>做法</h6><ol>${r.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
        <div class="scene-tip" style="background:var(--sand-s);color:#8A7A66">💡 ${esc(r.tip)}</div>
        <div style="display:flex;gap:8px;margin-top:13px">
          <button class="btn" data-act="pickMenu" data-n="${esc(r.n)}" style="flex:1">就做这个</button>
          <a class="btn ghost" href="${UI.xcf(r.n)}" target="_blank" rel="noopener" style="flex:0 0 auto">下厨房 ›</a>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--clay)"></span>换个口味</h2>
        <span class="more" data-act="allRecipe">全部 ${DB.recipes.length} 道 ›</span></div>
      ${more.map(x=>`<div class="bill">
        <div class="bill-e">🍽</div>
        <div class="bill-b"><h5>${esc(x.n)}</h5><p>${esc(x.t)} · ${esc(x.lv)} · ${esc(x.kcal)}</p></div>
        <button class="lk" data-act="openRecipe" data-n="${esc(x.n)}">看做法</button></div>`).join("")}
      <button class="btn ghost block" data-act="shuffle" style="margin-top:12px">🎲 随机换一批</button>
    </div>

    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--olive)"></span>本周菜单规划</h2>
        <span class="more" data-act="planDay" data-k="${S.ymd(new Date())}">规划今天 ›</span></div>
      ${(()=>{const out=[];const wd=["周日","周一","周二","周三","周四","周五","周六"];
        for(let i=0;i<7;i++){const dt=new Date();dt.setDate(dt.getDate()+i);
        const k=S.ymd(dt);const arr=menuItems(S.d.menu[k]);
        if(arr.length){
          const txt = arr.length<=2 ? arr.join("、") : arr.slice(0,2).join("、")+" +"+(arr.length-2);
          out.push(`<div class="kv day-row" data-act="planDay" data-k="${k}">
            <span>${wd[dt.getDay()]} ${dt.getMonth()+1}/${dt.getDate()}</span>
            <span><b>${esc(txt)}</b> <em class="lk sm" data-act="clearDayMenu" data-k="${k}">清</em></span></div>`);
        } else {
          out.push(`<div class="kv day-row" data-act="planDay" data-k="${k}">
            <span>${wd[dt.getDay()]} ${dt.getMonth()+1}/${dt.getDate()}</span>
            <span class="tiny day-add">＋ 安排</span></div>`);
        }
        }
        return out.join("");})()}
    </div>`;
  }

  /* ---------- 安排某一天菜单 ---------- */
  function planDaySheet(k){
    const dt = new Date(k + "T00:00:00");
    const wd = ["周日","周一","周二","周三","周四","周五","周六"][dt.getDay()];
    const cur = S.d.menu[k];
    const items = menuItems(cur);
    const recs = DB.recipes || [];
    const mine = S.d.myRecipes || [];
    const body = `
      <div class="tiny" style="margin-bottom:8px;color:var(--ink-3)">${wd} ${dt.getMonth()+1}/${dt.getDate()} · 可安排多道菜</div>
      ${items.length?`<div class="menu-list">${items.map(x=>`<div class="menu-item"><span>${esc(x)}</span><em class="lk sm" data-act="rmMenuItem" data-k="${k}" data-n="${esc(x)}">✕</em></div>`).join("")}</div>`
        :`<div class="tiny" style="margin-bottom:10px;color:var(--ink-3)">还没安排，挑几道吧～</div>`}
      <div class="fld"><label>再加一道（自定义）</label>
        <div style="display:flex;gap:8px">
          <input class="inp" id="dayMenuName" placeholder="写个想吃的，如 番茄牛腩" style="flex:1" />
          <button class="btn" data-act="setDayMenu" data-k="${k}" style="flex:0 0 auto">加上</button>
        </div>
      </div>
      ${recs.length?`<div class="sec-head" style="margin-top:4px"><h2>从菜谱库选</h2></div>
        <div class="chips">${recs.slice(0,30).map(r=>`<button class="chip" data-act="setDayMenu" data-k="${k}" data-n="${esc(r.n)}">${esc(r.n)}</button>`).join("")}</div>`:""}
      ${mine.length?`<div class="sec-head" style="margin-top:10px"><h2>我的私房菜</h2></div>
        <div class="chips">${mine.slice(0,30).map(r=>`<button class="chip" data-act="setDayMenu" data-k="${k}" data-n="${esc(r.n)}">${esc(r.n)}</button>`).join("")}</div>`:""}
      ${items.length?`<button class="btn ghost block" data-act="clearDayMenu" data-k="${k}" style="margin-top:14px">🗑 清空这天</button>`:""}
    `;
    UI.sheet("安排 " + wd, body);
  }

  /* ---------- 我的菜单 ---------- */
  function mine(){
    return `
    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--sand)"></span>添加我的菜谱</h2></div>
      <div class="fld"><label>菜名</label><input class="inp" id="mrN" placeholder="例如：外婆的红烧肉" /></div>
      <div class="fld"><label>食材</label><input class="inp" id="mrI" placeholder="五花肉 500g、冰糖、姜…" /></div>
      <div class="fld"><label>做法（每行一步）</label><textarea class="inp" id="mrS" placeholder="1. 五花肉切块焯水&#10;2. 炒糖色…"></textarea></div>
      <div style="display:flex;gap:8px">
        <input class="inp" id="mrT" placeholder="用时，如 40 分钟" style="flex:1" />
        <input class="inp" id="mrL" placeholder="难度" style="flex:1" />
      </div>
      <button class="btn block" data-act="addRecipe" style="margin-top:11px">保存菜谱 · +10 积分</button>
    </div>

    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--terra)"></span>我的私房菜</h2>
        <span class="more">${S.d.myRecipes.length} 道</span></div>
      ${S.d.myRecipes.length ? S.d.myRecipes.map((x,i)=>`<div class="bill">
          <div class="bill-e">📔</div>
          <div class="bill-b"><h5>${esc(x.n)}</h5><p>${esc(x.t||"—")} · ${esc(x.lv||"自定义")}</p></div>
          <button class="lk" data-act="openMine" data-i="${i}">查看</button>
          <button class="todo-x" data-act="delMine" data-i="${i}">✕</button></div>`).join("")
        : `<div class="empty"><span class="em">📔</span>把你会做的菜记下来<br>以后不用再想「今天吃什么」</div>`}
    </div>`;
  }

  /* ---------- 拍照打卡 ---------- */
  function photo(){
    const t = S.today();
    const ids = S.d.photos[t] || [];
    const allDays = Object.keys(S.d.photos).filter(k=>S.d.photos[k].length).sort().reverse().slice(0,6);
    const total = Object.values(S.d.photos).reduce((s,a)=>s+a.length,0);
    return `
    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--rose)"></span>今日餐桌</h2>
        <span class="more">累计 ${total} 张</span></div>
      <input type="file" id="fileInp" accept="image/*" style="display:none" />
      <div class="gal" id="todayGal">
        ${ids.map(id=>`<div class="shot" data-pid="${id}">
          <div class="ph"><span class="em">🖼</span>加载中</div>
          <button class="del" data-act="delPhoto" data-id="${id}">✕</button></div>`).join("")}
        <button class="shot" data-act="pickPhoto" style="border-style:dashed">
          <div class="ph"><span class="em">📷</span>拍照 / 相册</div></button>
      </div>
      <div class="tiny" style="margin-top:11px;line-height:1.8">照片保存在你的手机本地（IndexedDB），不会上传到任何服务器。每天第一张 +15 积分。</div>
    </div>

    ${allDays.length>1 ? `<div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--sand)"></span>美食相册</h2></div>
      ${allDays.filter(k=>k!==t).map(k=>`<div style="margin-bottom:14px">
        <div class="tiny" style="font-weight:700;margin-bottom:7px">${k}</div>
        <div class="gal">${S.d.photos[k].map(id=>`<div class="shot" data-pid="${id}"><div class="ph"><span class="em">🖼</span></div></div>`).join("")}</div>
      </div>`).join("")}
    </div>` : ""}`;
  }

  /* ---------- 地球 Online ---------- */
  function game(){
    const t = S.today();
    const qs = S.pickMany(DB.quests, 6, 5);
    const done = S.d.questDone[t] || [];
    const lv = S.level();
    const gotBadge = new Set(S.d.badges);
    const todayPts = qs.filter(q=>done.includes(q.t)).reduce((s,q)=>s+q.p,0);
    const maxPts = qs.reduce((s,q)=>s+q.p,0);

    return `
    <div class="earth">
      <div class="earth-top">
        <div>
          <div class="earth-lv">LEVEL ${lv.lv} · ${esc(lv.name)}</div>
          <h3 class="earth-t">地球 Online</h3>
          <div class="tiny" style="color:#6F7A6E;margin-top:5px">已连续在线 ${S.d.streak} 天 · 总积分 ${S.d.coins}</div>
        </div>
        <div class="earth-badge">🌏</div>
      </div>
      <div class="exp-row">
        <div class="lb"><span>经验值</span><span>${S.d.coins - lv.cur} / ${lv.next - lv.cur}</span></div>
        <div class="bar" style="background:rgba(255,255,255,.5)"><i style="width:${lv.pct}%;background:#7E9683"></i></div>
      </div>
    </div>

    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--olive)"></span>今日任务</h2>
        <span class="more">${todayPts} / ${maxPts} 积分</span></div>
      ${qs.map(q=>{
        const d = done.includes(q.t);
        return `<div class="quest ${d?"done":""}">
          <div class="q-e">${q.e}</div>
          <div class="q-b"><h5>${esc(q.t)} <span class="pill" style="background:var(--olive-s);color:#7A7E5E">${esc(q.tag)}</span></h5>
            <p>${esc(q.d)} · +${q.p} 积分</p></div>
          <button class="q-go ${d?"done":""}" data-act="quest" data-q="${esc(q.t)}" data-p="${q.p}">${d?"✓":"完成"}</button>
        </div>`;
      }).join("")}
      ${done.length>=qs.length ? `<div class="scene-tip" style="background:var(--sage-s);color:#5F7563;margin-top:12px">
        🎉 今日全部任务完成！你在地球的这一天，过得很扎实。</div>` : ""}
    </div>

    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--sand)"></span>成就徽章</h2>
        <span class="more">${gotBadge.size} / ${DB.badges.length}</span></div>
      <div class="badges">
        ${DB.badges.map(b=>`<div class="badge ${gotBadge.has(b.id)?"on":""}" data-act="badgeInfo" data-n="${esc(b.n)}" data-c="${esc(b.c)}">
          <div class="b">${b.e}</div><div class="n">${esc(b.n)}</div></div>`).join("")}
      </div>
    </div>

    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--mist)"></span>本周战绩</h2></div>
      ${(()=>{const out=[];for(let i=6;i>=0;i--){const dt=new Date();dt.setDate(dt.getDate()-i);
        const k=S.ymd(dt);const n=(S.d.questDone[k]||[]).length;
        out.push(`<div style="margin-bottom:9px">
          <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px">
            <span>${dt.getMonth()+1}/${dt.getDate()} ${["周日","周一","周二","周三","周四","周五","周六"][dt.getDay()]}</span>
            <b>${n} 个任务</b></div>
          <div class="bar"><i style="width:${Math.min(100,n/6*100)}%;background:var(--olive)"></i></div></div>`);}
        return out.join("");})()}
    </div>`;
  }

  /* ---------- 渲染后：加载图片 ---------- */
  async function afterRender(){
    const shots = document.querySelectorAll(".shot[data-pid]");
    for(const el of shots){
      const blob = await S.getImg(el.dataset.pid);
      if(blob){
        const url = URL.createObjectURL(blob);
        const img = new Image(); img.src = url;
        const ph = el.querySelector(".ph"); if(ph) ph.replaceWith(img);
      }
    }
    const fi = document.getElementById("fileInp");
    if(fi && !fi._bound){
      fi._bound = true;
      fi.addEventListener("change", async e => {
        const f = e.target.files[0]; if(!f) return;
        const id = "p" + Date.now();
        const blob = await compress(f);
        await S.putImg(id, blob);
        const t = S.today();
        S.d.photos[t] = S.d.photos[t] || [];
        const first = S.d.photos[t].length === 0;
        S.d.photos[t].push(id); S.save();
        if(first) S.addCoin(15,"餐桌打卡"); else UI.toast("已保存");
        S.checkBadges();
        e.target.value = "";
        App.refresh();
      });
    }
  }

  function compress(file){
    return new Promise(res=>{
      const img = new Image();
      img.onload = ()=>{
        const max = 1100;
        let { width:w, height:h } = img;
        if(w>max || h>max){ const r = Math.min(max/w, max/h); w = w*r|0; h = h*r|0; }
        const cv = document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        cv.toBlob(b=>res(b||file), "image/jpeg", .82);
      };
      img.onerror = ()=>res(file);
      img.src = URL.createObjectURL(file);
    });
  }

  /* ---------- 事件 ---------- */
  UI.on("fTab", el=>{ tab = el.dataset.t; App.refresh(); });
  UI.on("planDay", el=>{ planDaySheet(el.dataset.k); });
  UI.on("setDayMenu", el=>{
    const k = el.dataset.k;
    let n = el.dataset.n;
    if(!n){ const inp = document.getElementById("dayMenuName"); n = inp ? inp.value.trim() : ""; }
    if(!n){ UI.toast("先写个菜名吧"); return; }
    const r = addMenuDish(k, n);
    UI.closeSheet();
    if(r===1) S.addCoin(3,"安排菜单"); else if(r===0) S.addCoin(1,"加一道菜");
    App.refresh();
    if(r!==-1) planDaySheet(k); // 追加后刷新规划面板，方便继续加
  });
  UI.on("rmMenuItem", el=>{
    const k = el.dataset.k, n = el.dataset.n;
    const m = S.d.menu[k]; if(!m) return;
    const arr = menuItems(m).filter(x=>x!==n);
    if(arr.length) S.d.menu[k] = { items: arr }; else delete S.d.menu[k];
    S.save();
    const inSheet = !!el.closest("#sheetBody");
    App.refresh();
    if(inSheet) planDaySheet(k);
  });
  UI.on("clearDayMenu", el=>{
    delete S.d.menu[el.dataset.k];
    S.save(); UI.closeSheet(); App.refresh();
  });
  UI.on("pickMenu", el=>{
    const r = addMenuDish(S.today(), el.dataset.n);
    if(r===1) S.addCoin(10,"确定今日菜单"); else if(r===0) S.addCoin(3,"加一道菜");
    App.refresh();
  });
  UI.on("clearMenu", ()=>{ delete S.d.menu[S.today()]; S.save(); App.refresh(); });
  UI.on("shuffle", ()=>{ S.d.seedOffset++; S.save(); UI.toast("换一批菜谱"); App.refresh(); });
  UI.on("openRecipe", el=>{
    const r = DB.recipes.find(x=>x.n===el.dataset.n); if(!r) return;
    UI.sheet(r.n, `<div class="recipe-meta" style="margin-bottom:12px"><span>⏱ ${esc(r.t)}</span><span>🎯 ${esc(r.lv)}</span><span>🔥 ${esc(r.kcal)}</span></div>
      <h6 style="font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.6px">食材</h6>
      <p style="font-size:13px;line-height:1.8;color:var(--ink-2)">${esc(r.ing)}</p>
      <h6 style="font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.6px">做法</h6>
      <ol style="font-size:13px;line-height:1.9;color:var(--ink-2);padding-left:18px">${r.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
      <div class="scene-tip" style="background:var(--sand-s);color:#8A7A66">💡 ${esc(r.tip)}</div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn" data-act="pickMenu" data-n="${esc(r.n)}" style="flex:1">就做这个</button>
        <a class="btn ghost" href="${UI.xcf(r.n)}" target="_blank" rel="noopener">下厨房</a></div>`);
  });
  UI.on("allRecipe", ()=>{
    UI.sheet("全部菜谱（"+DB.recipes.length+" 道）", DB.recipes.map(x=>`<div class="bill">
      <div class="bill-e">🍽</div>
      <div class="bill-b"><h5>${esc(x.n)}</h5><p>${esc(x.t)} · ${esc(x.lv)} · ${esc(x.kcal)}</p></div>
      <button class="lk" data-act="openRecipe" data-n="${esc(x.n)}">做法</button></div>`).join(""));
  });
  UI.on("addRecipe", ()=>{
    const n = document.getElementById("mrN").value.trim();
    if(!n) return UI.toast("先给菜起个名字");
    S.d.myRecipes.push({ n, ing:document.getElementById("mrI").value.trim(),
      steps:document.getElementById("mrS").value.split("\n").filter(x=>x.trim()),
      t:document.getElementById("mrT").value.trim(), lv:document.getElementById("mrL").value.trim() });
    S.save(); S.addCoin(10,"新增菜谱"); App.refresh();
  });
  UI.on("openMine", el=>{
    const r = S.d.myRecipes[Number(el.dataset.i)];
    UI.sheet(r.n, `<p style="font-size:13px;line-height:1.8;color:var(--ink-2)"><b>食材：</b>${esc(r.ing||"—")}</p>
      <ol style="font-size:13px;line-height:1.9;color:var(--ink-2);padding-left:18px">${(r.steps||[]).map(s=>`<li>${esc(s)}</li>`).join("")||"<li>暂无步骤</li>"}</ol>
      <button class="btn block" data-act="pickMenu" data-n="${esc(r.n)}">今天就做它</button>`);
  });
  UI.on("delMine", el=>{ S.d.myRecipes.splice(Number(el.dataset.i),1); S.save(); App.refresh(); });
  UI.on("pickPhoto", ()=>{ document.getElementById("fileInp").click(); });
  UI.on("delPhoto", async el=>{
    const id = el.dataset.id;
    await S.delImg(id);
    const t = S.today();
    S.d.photos[t] = (S.d.photos[t]||[]).filter(x=>x!==id); S.save(); App.refresh();
  });
  UI.on("badgeInfo", el=>{ UI.toast(el.dataset.n + " · " + el.dataset.c); });

  return { render, afterRender };
})();

</script>

          <div class="step-b">
            <div class="wk">${esc(x.wk)}</div>
            <h5>${esc(x.t)}</h5>

      <div class="scene-tip" style="background:var(--rose-s);color:#8B6A6E">
        ⚠️ 提醒：不要在 1000 粉之前买课、买设备、买涨粉服务。这个阶段唯一该投入的是时间。</div>
    </div>

    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--lilac)"></span>发布记录</h2>
        <span class="more">共 ${S.d.posts.length} 条</span></div>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <input class="inp" id="pTitle" placeholder="这条内容的标题…" style="flex:1" />

            <div class="bill-e">${p.plat==="抖音"?"🎵":p.plat==="小红书"?"📕":p.plat==="B站"?"📺":"🎬"}</div>
            <div class="bill-b"><h5>${esc(p.t)}</h5><p>${esc(p.date)} · ${esc(p.plat)}</p></div>

  /* ---------- 每日热点 ---------- */
  function hot(){

    </div>

    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--mist)"></span>选题灵感生成器</h2></div>

      <button class="btn ghost block" data-act="reIdea" style="margin-top:12px">🎲 再来一批</button>

    const A = ["我用 30 天","作为一个普通人，我","没人告诉我","如果你也","我花了 3 个月才明白","打工人版"];

      <div class="kv"><span>配乐</span><b>剪映音乐库（注意商用授权）</b></div>
      <div class="kv"><span>拍摄</span><b>手机 + 一个三脚架就够</b></div>
      <div class="kv"><span>提词</span><b>剪映「提词器」或备忘录</b></div>
      <div class="scene-tip">设备不是瓶颈，选题和表达才是。前 50 条视频不要花钱买任何设备。</div>

  /* ---------- 脚本拆解 ---------- */
  function script(){
    return `
    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--terra)"></span>五段式拆解框架</h2></div>
      ${DB.scriptFrame.map((f,i)=>`<div class="lesson">
        <div class="lesson-n" style="background:var(--terra-s);color:var(--terra);width:auto;padding:0 8px;border-radius:9px;font-size:10px">${esc(f.p)}</div>
        <div class="lesson-b"><h5>${esc(f.q)}</h5><p>常见做法：${esc(f.eg)}</p></div></div>`).join("")}
    </div>

    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--rose)"></span>今日拆解范例</h2></div>
      <div id="demoBox"><div class="empty">加载中…</div></div>
    </div>

    <div class="card">
      <div class="sec-head"><h2><span class="dot" style="background:var(--mist)"></span>我的拆解笔记</h2>
        <span class="more">${S.d.scripts.length} 篇</span></div>
      <div class="fld"><label>拆解的视频（标题或链接）</label><input class="inp" id="scT" placeholder="例如：@某某《一个人住的第 300 天》" /></div>

        <label>${esc(f.p)} — ${esc(f.q)}</label>
        <input class="inp" id="sc${i}" placeholder="${esc(f.eg.split(" / ")[0])}" /></div>`).join("")}
      <div class="fld"><label>我能抄走的一点</label><textarea class="inp" id="scTake" placeholder="下一条视频我要用上的具体做法"></textarea></div>
      <button class="btn block" data-act="saveScript">保存拆解 · +25 积分</button>
      ${S.d.scripts.length ? `<div style="margin-top:14px">${S.d.scripts.slice().reverse().slice(0,6).map((s,i)=>
        `<div class="bill"><div class="bill-e">🧩</div>
          <div class="bill-b"><h5>${esc(s.t)}</h5><p>${esc(s.date)}</p></div>

    </div>`;

  /* ---------- 渲染后 ---------- */
  async function afterRender(){
    if(!dailyData) dailyData = await S.fetchDaily();
    const tr = dailyData.trend || DB.fallbackTrends;

    const box = document.getElementById("hotBox");
    if(box){
      box.innerHTML = (tr.date?`<div class="tiny" style="margin-bottom:9px">📅 ${esc(tr.date)} 数据</div>`:"")
      + `<div class="tiny" style="font-weight:700;color:#C0555F;margin:4px 0 6px">📕 小红书热门话题</div>`
      + (tr.xhs||[]).map((x,i)=>`<div class="hot">
          <div class="hot-n" style="background:#C0736F">${i+1}</div>
          <div class="hot-b"><h5>${esc(x.t)}</h5><p>${esc(x.d||"")}</p></div></div>`).join("")

          <div class="hot-n" style="background:#5C5A57">${i+1}</div>

    }

    if(demo){
      const sc = tr.script || DB.fallbackTrends.script;
      demo.innerHTML = `<h4 style="margin:0 0 11px;font-size:14.5px;font-weight:650">${esc(sc.title)}</h4>`
        + (sc.rows||[]).map(r=>`<div class="lesson">
            <div class="lesson-n" style="background:var(--rose-s);color:var(--rose);width:auto;padding:0 7px;border-radius:8px;font-size:10px">${esc(r.p)}</div>
            <div class="lesson-b"><h5 style="font-weight:600;font-size:13px">${esc(r.c)}</h5>
            <p>🔍 ${esc(r.w)}</p></div></div>`).join("");
    }
  }

  /* ---------- 事件 ---------- */
  UI.on("dTab", el=>{ tab = el.dataset.t; App.refresh(); });
  UI.on("editAcct", ()=>{
    const a = acct();
    UI.sheet("编辑账号信息", `

      <button class="btn block" data-act="saveAcct">保存</button>`);

  UI.on("saveAcct", ()=>{
    const a = S.d.account;
    a.name = document.getElementById("acN").value.trim() || a.name;
    a.slogan = document.getElementById("acS").value.trim();

        <div style="display:flex;gap:5px;margin-top:8px;flex-wrap:wrap">${p.tags.map(t=>
          `<span class="pill" style="background:var(--card-2);color:var(--ink-3)">#${esc(t)}</span>`).join("")}</div>
      </button>`).join("") + `<div class="scene-tip">起名三原则：好念、好记、能长出系列感。名字里带「浅浅」，是为了让内容和人绑定。</div>`);
  });
  UI.on("useName", el=>{
    const p = NAME_POOL[Number(el.dataset.i)];
    Object.assign(S.d.account, { name:p.n, slogan:p.s, tags:p.tags });
    S.save(); UI.closeSheet(); App.refresh(); UI.toast("账号名已更新");
  });
  UI.on("mStep", el=>{
    const i = Number(el.dataset.i);
    if(S.d.mediaDone.includes(i)){ S.d.mediaDone = S.d.mediaDone.filter(x=>x!==i); S.save(); }
    else { S.d.mediaDone.push(i); S.save(); S.addCoin(40,"完成起号阶段"); }

  });
  UI.on("addPost", ()=>{
    const t = document.getElementById("pTitle").value.trim();
    if(!t) return UI.toast("写个标题吧");
    S.d.posts.push({ t, plat:document.getElementById("pPlat").value, date:S.today(), data:null });

  UI.on("postData", el=>{

    UI.sheet(p.t, `
      <div class="grid2">

        <div class="fld"><label>点赞</label><input class="inp" id="d1" type="number" value="${dt.l||""}" /></div>
        <div class="fld"><label>收藏</label><input class="inp" id="d2" type="number" value="${dt.c||""}" /></div>
        <div class="fld"><label>评论</label><input class="inp" id="d3" type="number" value="${dt.m||""}" /></div>
      </div>
      <div class="scene-tip">完播低 → 改前 3 秒；收藏低 → 加干货密度；评论低 → 结尾加提问。</div>
      <button class="btn block" data-act="savePostData" data-i="${i}" style="margin-top:12px">保存数据</button>`);
  });
  UI.on("savePostData", el=>{
    const i = Number(el.dataset.i);
    S.d.posts[i].data = { v:document.getElementById("d0").value, l:document.getElementById("d1").value,
      c:document.getElementById("d2").value, m:document.getElementById("d3").value };
    S.save(); UI.closeSheet(); UI.toast("数据已记录");
  });
  UI.on("refreshHot", async ()=>{ dailyData=null; UI.toast("正在获取…"); await afterRender(); UI.toast("已更新"); });
  UI.on("reIdea", ()=>{ S.d.seedOffset++; S.save(); document.getElementById("ideaBox").innerHTML = ideas(); });
  UI.on("readTip", ()=>{
    if(S.d.tipRead[S.today()]) return UI.toast("今天已学过啦");
    S.d.tipRead[S.today()] = true; S.save(); S.addCoin(15,"剪辑技巧"); App.refresh();
  });
  UI.on("allTips", ()=>{
    UI.sheet("全部剪辑技巧（"+DB.editTips.length+"）", DB.editTips.map(x=>`
      <div class="card tight" style="margin-bottom:10px">
        <h4 style="margin:0 0 5px;font-size:14.5px">${esc(x.t)}</h4>
        <p style="margin:0;font-size:12.5px;line-height:1.75;color:var(--ink-2)">${esc(x.d)}</p>
        <ol style="margin:8px 0 0;padding-left:16px;font-size:12px;line-height:1.8;color:var(--ink-3)">
          ${x.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>`).join(""));
  });
  UI.on("saveScript", ()=>{
    const t = document.getElementById("scT").value.trim();
    if(!t) return UI.toast("填一下拆解的视频");
    const rows = DB.scriptFrame.map((f,i)=>({ p:f.p, v:document.getElementById("sc"+i).value.trim() }));
    S.d.scripts.push({ t, date:S.today(), rows, take:document.getElementById("scTake").value.trim() });
    S.save(); S.addCoin(25,"脚本拆解"); App.refresh();
  });
  UI.on("openScript", el=>{
    const s = S.d.scripts[Number(el.dataset.i)];
    UI.sheet(s.t, s.rows.map(r=>`<div class="lesson">
      <div class="lesson-n" style="background:var(--mist-s);color:var(--mist);width:auto;padding:0 7px;border-radius:8px;font-size:10px">${esc(r.p)}</div>
      <div class="lesson-b"><p style="margin:0">${esc(r.v||"（未填写）")}</p></div></div>`).join("")
      + `<div class="scene-tip">✍️ 我能抄走的：${esc(s.take||"未填写")}</div>`);

  return { render, afterRender };
})();

</script>
<script>
/* ============ 碎碎念：记录身边的小事 ============ */
window.ViewMuse = (function () {
  const { esc } = UI;
  let curType = "note";      // 当前选中的类型
  let draft = "";            // 输入框草稿（切换类型时不丢）
  let pendingBlob = null;    // 待发布的照片文件
  let pendingUrl = null;     // 预览用的 object URL

  function timeStr(ts){
    const dt = new Date(ts);
    const p = n => String(n).padStart(2,"0");
    return (dt.getMonth()+1)+"月"+dt.getDate()+"日 "+p(dt.getHours())+":"+p(dt.getMinutes());
  }

  function render(){
    const list = S.museList();
    const types = Object.values(DB.museTypes).map(t=>
      `<button class="chip ${curType===t.key?"on":""}" data-act="museType" data-k="${t.key}">${t.emoji} ${t.label}</button>`).join("");

    const prev = pendingUrl
      ? `<div class="muse-prev"><img class="muse-prev-img" src="${pendingUrl}"/>
           <button class="muse-prev-x" data-act="musePrevX" title="移除">✕</button></div>`
      : "";

    return `
    <div class="page-hero">
      <div class="date">LITTLE THINGS</div>
      <h2>碎碎念</h2>
      <p>拍到的好看、小抱怨、小美好，都记下来吧——记录本身就有意义。</p>
    </div>

    <!-- 记录区 -->
    <div class="card muse-compose">
      <div class="chips" style="margin-bottom:11px">${types}</div>
      <textarea class="inp" id="museInp" placeholder="今天发生了什么？随手记一句，或拍张好看的照片…">${esc(draft)}</textarea>
      <input type="file" id="museFile" accept="image/*" style="display:none" />
      ${prev}
      <div class="muse-actions">
        <button class="lk" data-act="musePick">📷 拍照 / 相册</button>
        <button class="btn" data-act="musePost" style="flex:1">记录下来 · +3</button>
      </div>
      <div class="tiny" style="margin-top:9px;line-height:1.7">照片保存在你的手机本地（IndexedDB），不上传任何服务器。每天多记几条，慢慢就攒成了一本自己的小日记。</div>
    </div>

    <!-- 时间线 -->
    <div class="card">
      <div class="sec-head">
        <h2><span class="dot" style="background:var(--terra)"></span>我的碎碎念</h2>
        <span class="more">${list.length} 条</span>
      </div>
      ${list.length ? list.map(museCard).join("") :
        `<div class="empty"><span class="em">📝</span>还没有记录<br>把今天让你在意的一件小事写下来吧</div>`}
    </div>
    `;
  }

  function museCard(m){
    const t = DB.museTypes[m.type] || DB.museTypes.note;
    return `
    <div class="muse-card">
      <div class="muse-head">
        <span class="pill" style="background:var(${t.s});color:var(${t.color})">${t.emoji} ${t.label}</span>
        <span class="muse-time">${timeStr(m.ts)}</span>
        <button class="todo-x" data-act="museDel" data-id="${m.id}" title="删除">✕</button>
      </div>
      ${m.text ? `<div class="muse-text">${esc(m.text)}</div>` : ""}
      ${m.photoId ? `<div class="muse-ph" data-pid="${m.photoId}"><span class="em">🖼</span></div>` : ""}
    </div>`;
  }

  function clearPending(){
    pendingBlob = null;
    if(pendingUrl){ try{ URL.revokeObjectURL(pendingUrl); }catch(e){} pendingUrl = null; }
  }

  async function afterRender(){
    // 草稿同步
    const inp = document.getElementById("museInp");
    if(inp && !inp._bound){
      inp._bound = true;
      inp.addEventListener("input", ()=>{ draft = inp.value; });
    }
    // 选图
    const fi = document.getElementById("museFile");
    if(fi && !fi._bound){
      fi._bound = true;
      fi.addEventListener("change", e=>{
        const f = e.target.files && e.target.files[0];
        if(!f) return;
        pendingBlob = f;
        if(pendingUrl) URL.revokeObjectURL(pendingUrl);
        pendingUrl = URL.createObjectURL(f);
        App.refresh();
        e.target.value = "";
      });
    }
    // 删除预览图
    const prevX = document.querySelector(".muse-prev-x");
    if(prevX && !prevX._bound){
      prevX._bound = true;
      prevX.addEventListener("click", (ev)=>{ ev.stopPropagation(); clearPending(); App.refresh(); });
    }
    // 加载时间线里的照片
    const phs = document.querySelectorAll(".muse-ph[data-pid]");
    for(const el of phs){
      const blob = await S.getImg(el.dataset.pid);
      if(blob){
        const url = URL.createObjectURL(blob);
        const img = new Image(); img.src = url; img.className = "muse-img";
        img.onload = ()=>{ try{ URL.revokeObjectURL(url); }catch(e){} };
        el.innerHTML = ""; el.appendChild(img);
      }
    }
  }

  /* ---------- 事件 ---------- */
  UI.on("museType", el=>{ curType = el.dataset.k; App.refresh(); });
  UI.on("musePick", ()=>{ const fi = document.getElementById("museFile"); if(fi) fi.click(); });
  UI.on("musePost", async ()=>{
    const inp = document.getElementById("museInp");
    const text = inp ? inp.value.trim() : "";
    if(!text && !pendingBlob) return UI.toast("写点什么，或加张照片吧");
    await S.addMuse(text, curType, pendingBlob);
    draft = ""; clearPending();
    UI.toast("已记录 ✦");
    App.refresh();
  });
  UI.on("museDel", async el=>{
    await S.delMuse(el.dataset.id);
    UI.toast("已删除");
    App.refresh();
  });

  return { render, afterRender };
})();

</script>
<script>
/* ============ 应用主控 ============ */
window.App = (function () {
  const { $, esc } = UI;
  const views = { today:ViewToday, money:ViewMoney, learn:ViewLearn, life:ViewLife, media:ViewMedia, muse:ViewMuse };
  const titles = {
    today:["浅浅的工作台","今天也要慢慢变好呀"],
    money:["理财学习","看清钱的流向，才有选择权"],
    learn:["学习中心","阅读 · 雅思 · 每天一点点"],
    life:["生活日常","好好吃饭，认真通关"],
    media:["自媒体计划","记录生活，也经营生活"],
    muse:["碎碎念","把身边的小事收进来"]
  };
  let cur = "today";
  let scrollMem = {};
  let unlocked = false;
  let pinBuf = "";
  let hiddenAt = 0;

  function refresh(keepScroll){
    if(maybeLock()){ showLock(); return; }
    hideLock();
    const sc = $("#screen");
    const pos = sc.scrollTop;
    sc.innerHTML = views[cur].render();
    if(keepScroll !== false) sc.scrollTop = pos;
    UI.syncCoin();
    const v = views[cur];
    if(v.afterRender) v.afterRender();
  }

  function go(tab){
    if(!views[tab]) return;
    scrollMem[cur] = $("#screen").scrollTop;
    cur = tab;
    document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active", b.dataset.tab===tab));
    $("#topTitle").textContent = titles[tab][0];
    $("#topSub").textContent = tab==="today" ? S.greet() : titles[tab][1];
    if(maybeLock()){ showLock(); return; }
    hideLock();
    const sc = $("#screen");
    sc.innerHTML = views[cur].render();
    sc.scrollTop = scrollMem[tab] || 0;
    UI.syncCoin();
    if(views[cur].afterRender) views[cur].afterRender();
  }

  /* ---------- 应用锁 ---------- */
  function maybeLock(){ return S.lockEnabled() && !unlocked; }
  function lockInner(){
    const name = S.d.profile.name || "浅浅";
    const dots = Array.from({length:8},(_,i)=>`<i class="${i<pinBuf.length?'on':''}"></i>`).join("");
    return `<div class="lock-inner">
      <div class="lock-ava">${esc(name.slice(0,1))}</div>
      <h3 class="lock-hi">${esc(name)}的工作台</h3>
      <p class="lock-sub">输入密码以进入</p>
      <div class="lock-dots">${dots}</div>
      <div class="lock-kp">
        ${[1,2,3,4,5,6,7,8,9].map(k=>`<button class="lkp" data-act="lockKey" data-k="${k}">${k}</button>`).join("")}
        <button class="lkp lkp-x" data-act="lockKey" data-k="del">⌫</button>
        <button class="lkp" data-act="lockKey" data-k="0">0</button>
        <button class="lkp lkp-go" data-act="lockKey" data-k="ok">解锁</button>
      </div>
      <button class="lock-forgot" data-act="lockForgot">忘记密码？</button>
    </div>`;
  }
  function showLock(){ const ll = $("#lockLayer"); ll.innerHTML = lockInner(); ll.classList.add("on"); }
  function hideLock(){ const ll = $("#lockLayer"); ll.classList.remove("on"); ll.innerHTML = ""; }
  function renderLock(wrong){
    const ll = $("#lockLayer");
    ll.innerHTML = lockInner();
    if(wrong){ const el = ll.querySelector(".lock-inner"); if(el) el.classList.add("wrong"); }
  }
  function submitLock(){
    if(pinBuf.length < 4){ UI.toast("密码至少 4 位"); return; }
    if(!S.verifyPin(pinBuf)){ pinBuf=""; renderLock(true); UI.toast("密码错误，再试试"); return; }
    pinBuf=""; unlocked=true; hideLock(); refresh();
  }

  /* ---------- 设置 ---------- */
  function syncStatText(){
    if(!S.getSyncURL()) return "未开启";
    const at = S.syncInfo().at;
    const when = at ? new Date(at).toLocaleString() : "—";
    return "✅ Supabase 云端同步 · 最后同步 " + when;
  }
  function settings(){
    const total = Object.values(S.d.photos).reduce((s,a)=>s+a.length,0);
    UI.sheet("设置", `
      <div class="fld"><label>你的名字</label><input class="inp" id="stName" value="${esc(S.d.profile.name)}" /></div>
      <div class="card tight">
        <div class="kv"><span>累计积分</span><b>${S.d.coins}</b></div>
        <div class="kv"><span>当前等级</span><b>Lv.${S.level().lv} ${esc(S.level().name)}</b></div>
        <div class="kv"><span>连续打卡</span><b>${S.d.streak} 天</b></div>
        <div class="kv"><span>记账笔数</span><b>${S.d.bills.length}</b></div>
        <div class="kv"><span>读书打卡</span><b>${Object.keys(S.d.bookLog).length} 天</b></div>
        <div class="kv"><span>掌握单词</span><b>${Object.values(S.d.wordBox).filter(w=>w.lvl>=2).length}</b></div>
        <div class="kv"><span>餐桌照片</span><b>${total} 张</b></div>
        <div class="kv"><span>碎碎念</span><b>${S.d.muses.length} 条</b></div>
        <div class="kv"><span>发布内容</span><b>${S.d.posts.length} 条</b></div>
      </div>

        <div class="card tight">
          <div class="tiny" style="font-weight:700;margin-bottom:8px">⏰ 每日自动推送</div>
          <div class="kv"><span>08:00 平台热点</span><b style="color:var(--sage)">已配置</b></div>
          <div class="kv"><span>08:30 每日新闻</span><b style="color:var(--sage)">已配置</b></div>
          <div class="kv"><span>09:00 精选播客</span><b style="color:var(--sage)">已配置</b></div>
          <p class="tiny" style="line-height:1.8;margin:9px 0 0">助手会在这些时间点生成内容，写入
          <code style="font-size:10.5px">data/daily/</code> 下的 JSON 文件。App 每次打开会自动读取最新一份，读不到时使用本地缓存。播客在学习页「🎧 播客」里看。</p>
        </div>

      <div class="card tight">
        <div class="tiny" style="font-weight:700;margin-bottom:8px">🔒 应用锁</div>
        <div class="kv"><span>当前状态</span><b style="color:${S.lockEnabled()?'var(--sage)':'var(--ink-3)'}">${S.lockEnabled()?"已开启":"未开启"}</b></div>
        ${S.lockEnabled()
          ? `<div style="display:flex;gap:8px;margin-top:9px">
               <button class="btn ghost" data-act="lockChange" style="flex:1">修改密码</button>
               <button class="btn ghost" data-act="lockDisable" style="flex:1;color:var(--up)">关闭应用锁</button>
             </div>`
          : `<button class="btn ghost block" data-act="lockEnable" style="margin-top:9px">开启应用锁</button>`}
        <p class="tiny" style="line-height:1.8;margin:9px 0 0">开启后，每次打开工作台都需输入密码。密码仅保存本机，忘记只能清空数据重设。</p>
      </div>

      <div class="card tight">
        <div class="tiny" style="font-weight:700;margin-bottom:8px">☁️ 多设备云同步</div>
        <div class="kv"><span>同步状态</span><b id="syncStat">${syncStatText()}</b></div>
        <div style="display:flex;gap:8px;margin-top:9px">
          <button class="btn ghost" data-act="syncNow" style="flex:1">立即同步</button>
          ${S.getSyncURL() ? `<button class="btn ghost" data-act="syncOff" style="flex:1;color:var(--up)">断开同步</button>` : `<button class="btn ghost" data-act="syncOn" style="flex:1">开启同步</button>`}
        </div>
        <p class="tiny" style="line-height:1.8;margin:9px 0 0">数据通过 Supabase 云端实时同步：手机和电脑打开任意一端都会自动共享打卡、积分、待办、复盘、账单、碎碎念等。照片默认仅存本机。</p>
      </div>

      <div class="card tight">
        <div class="tiny" style="font-weight:700;margin-bottom:8px">📲 添加到主屏幕（像 App 一样用）</div>
        <div class="tiny" style="line-height:1.9">
          <b>iPhone（Safari）</b>：打开网址 → 点底部「分享」图标 → <b>添加到主屏幕</b> → 完成。<br>
          <b>安卓（Chrome）</b>：打开网址 → 点右上「⋯」→ <b>添加到主屏幕 / 安装应用</b>。<br>
          <b>电脑（Chrome/Edge）</b>：打开网址 → 点右上「⋯」→ <b>投射、保存和分享 → 创建快捷方式</b>，勾选「作为窗口打开」→ 桌面就多了一个图标。
        </div>
      </div>

      <div style="display:flex;gap:8px;margin-top:6px">
        <button class="btn ghost" data-act="exportData" style="flex:1">导出数据</button>
        <button class="btn ghost" data-act="importData" style="flex:1">导入数据</button>
      </div>
      <button class="btn ghost block" data-act="resetAll" style="margin-top:9px;color:var(--up)">清空所有数据</button>
      <p class="tiny" style="text-align:center;margin-top:14px;line-height:1.8">
        未开启云同步时，数据只保存在本机浏览器；开启后实时备份到同步服务器<br>浅浅的工作台 v1.0</p>`);
  }

  UI.on("go", el=>go(el.dataset.tab));
  UI.on("exportData", ()=>{
    const blob = new Blob([S.exportData()], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "浅浅的工作台-备份-" + S.today() + ".json";
    a.click(); UI.toast("已导出备份文件");
  });
  UI.on("importData", ()=>{
    UI.sheet("导入数据", `<div class="fld"><label>粘贴之前导出的 JSON</label>
      <textarea class="inp" id="impTxt" style="min-height:180px" placeholder='{"coins":...}'></textarea></div>
      <button class="btn block" data-act="doImport">确认导入（会覆盖当前数据）</button>`);
  });
  UI.on("doImport", ()=>{
    if(S.importData(document.getElementById("impTxt").value)){ UI.toast("导入成功"); setTimeout(()=>location.reload(),700); }
    else UI.toast("格式不正确");
  });
  UI.on("resetAll", ()=>{
    UI.sheet("确认清空？", `<p style="font-size:13.5px;line-height:1.8;color:var(--ink-2)">
      这会删除所有待办、复盘、账单、打卡、照片记录，且无法恢复。<br><br>建议先导出一份备份。</p>
      <button class="btn block" data-act="doReset" style="background:var(--up);margin-top:10px">我确定，清空</button>
      <button class="btn ghost block" data-act="closeSheet" style="margin-top:9px">再想想</button>`);
  });
  UI.on("doReset", ()=>S.reset());
  UI.on("closeSheet", ()=>UI.closeSheet());

  /* ---------- 应用锁交互 ---------- */
  UI.on("lockKey", el=>{
    const k = el.dataset.k;
    if(k === "del"){ pinBuf = pinBuf.slice(0,-1); }
    else if(k === "ok"){ submitLock(); return; }
    else if(/^\d$/.test(k)){ if(pinBuf.length < 8) pinBuf += k; }
    renderLock(false);
  });
  UI.on("lockForgot", ()=>{
    UI.sheet("忘记密码", `<p style="font-size:13.5px;line-height:1.8;color:var(--ink-2)">
      密码只保存在你本机，无法找回。<br>只能<b>清空全部数据</b>后重新使用（应用锁也会关闭）。<br><br>建议先导出一份备份。</p>
      <button class="btn block" data-act="doLockReset" style="background:var(--up);margin-top:10px">清空数据并重置</button>
      <button class="btn ghost block" data-act="closeSheet" style="margin-top:9px">再想想</button>`);
  });
  UI.on("doLockReset", ()=>S.reset());
  UI.on("lockEnable", ()=>{
    UI.sheet("设置应用锁密码", `
      <p class="tiny" style="line-height:1.8;margin-bottom:10px">设置一个 4–8 位数字密码，下次打开工作台时需要它。</p>
      <div class="fld"><label>输入密码</label><input type="tel" inputmode="numeric" maxlength="8" id="lp1" class="inp" placeholder="4–8 位数字"></div>
      <div class="fld"><label>再次输入</label><input type="tel" inputmode="numeric" maxlength="8" id="lp2" class="inp" placeholder="再输一次"></div>
      <button class="btn block" data-act="doLockSet">确定开启</button>`);
  });
  UI.on("doLockSet", ()=>{
    const a = $("#lp1").value, b = $("#lp2").value;
    if(!/^\d{4,8}$/.test(a)){ UI.toast("密码需为 4–8 位数字"); return; }
    if(a !== b){ UI.toast("两次输入不一致"); return; }
    S.setPin(a); unlocked = true; UI.closeSheet(); UI.toast("🔒 应用锁已开启"); settings();
  });
  UI.on("lockChange", ()=>{
    UI.sheet("修改密码", `
      <div class="fld"><label>当前密码</label><input type="tel" inputmode="numeric" maxlength="8" id="lp0" class="inp"></div>
      <div class="fld"><label>新密码</label><input type="tel" inputmode="numeric" maxlength="8" id="lp1" class="inp"></div>
      <div class="fld"><label>再次输入新密码</label><input type="tel" inputmode="numeric" maxlength="8" id="lp2" class="inp"></div>
      <button class="btn block" data-act="doLockChange">确定修改</button>`);
  });
  UI.on("doLockChange", ()=>{
    const o = $("#lp0").value, a = $("#lp1").value, b = $("#lp2").value;
    if(!S.verifyPin(o)){ UI.toast("当前密码错误"); return; }
    if(!/^\d{4,8}$/.test(a)){ UI.toast("新密码需为 4–8 位数字"); return; }
    if(a !== b){ UI.toast("两次输入不一致"); return; }
    S.changePin(o, a); unlocked = true; UI.closeSheet(); UI.toast("✅ 密码已修改"); settings();
  });
  UI.on("lockDisable", ()=>{
    UI.sheet("关闭应用锁", `<p class="tiny" style="line-height:1.8;margin-bottom:10px">请输入当前密码确认关闭。</p>
      <div class="fld"><label>当前密码</label><input type="tel" inputmode="numeric" maxlength="8" id="lp0" class="inp"></div>
      <button class="btn block" data-act="doLockDisable" style="background:var(--up)">确认关闭</button>`);
  });
  UI.on("doLockDisable", ()=>{
    const o = $("#lp0").value;
    if(!S.verifyPin(o)){ UI.toast("密码错误"); return; }
    S.disableLock(); UI.closeSheet(); UI.toast("应用锁已关闭"); settings();
  });

  /* ---------- 云同步面板 ---------- */
  UI.on("syncTest", async ()=>{
    UI.toast("正在测试云端连接…");
    const ok = await S.testSupa();
    UI.toast(ok ? "✅ Supabase 云端连接正常" : "❌ 无法连接云端");
    settings();
  });
  UI.on("syncNow", async ()=>{
    if(!S.getSyncURL()){ await S.setSyncURL("supabase"); }
    await S.pushSync(); await S.pullSync(); UI.toast("☁️ 已同步"); settings();
  });
  UI.on("syncOn", async ()=>{
    await S.setSyncURL("supabase"); UI.toast("✅ 已开启云端同步"); settings();
  });
  UI.on("syncOff", async ()=>{
    await S.setSyncURL(""); UI.toast("已断开同步"); settings();
  });

  /* ---------- 启动 ---------- */
  function init(){
    S.checkIn();
    S.initSync();
    document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click", ()=>go(b.dataset.tab)));
    $("#sheetClose").addEventListener("click", UI.closeSheet);
    $("#sheetMask").addEventListener("click", UI.closeSheet);
    $("#btnSetting").addEventListener("click", settings);
    $("#btnCoin").addEventListener("click", ()=>go("life"));
    $("#avatar").textContent = (S.d.profile.name||"浅").slice(0,1);

    // 保存名字
    document.addEventListener("input", e=>{
      if(e.target.id === "stName"){
        S.d.profile.name = e.target.value.trim() || "浅浅"; S.save();
        $("#avatar").textContent = S.d.profile.name.slice(0,1);
      }
    });

    // 跨天自动刷新
    let lastDay = S.today();
    setInterval(()=>{ if(S.today() !== lastDay){ lastDay = S.today(); S.checkIn(); go(cur); UI.toast("新的一天，工作台已更新"); } }, 60000);
    document.addEventListener("visibilitychange", ()=>{
      if(document.hidden){ hiddenAt = Date.now(); return; }
      const longAway = hiddenAt && (Date.now()-hiddenAt > 60000);
      hiddenAt = 0;
      if(longAway && S.lockEnabled()) unlocked = false;
      if(S.today() !== lastDay){ lastDay = S.today(); S.checkIn(); go(cur); }
      else if(longAway && S.lockEnabled()) refresh();
    });

    go("today");
    setTimeout(()=>{
      const st = S.d.streak;
      if(st > 1) UI.toast("👋 欢迎回来，已连续来到工作台 " + st + " 天");
    }, 800);
  }

  return { refresh, go, init };
})();

document.addEventListener("DOMContentLoaded", App.init);

</script>
</body>
</html>
